<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>ヒトミル - 退館</title>
  <script src="https://static.line-scdn.net/liff/edge/versions/2.22.3/sdk.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg:      #1C1C1E;
      --bg2:     #2C2C2E;
      --bg3:     #3A3A3C;
      --yellow:  #FFC107;
      --yellow2: #FFD54F;
      --green:   #34C759;
      --red:     #FF3B30;
      --text:    #FFFFFF;
      --text2:   rgba(235,235,245,0.6);
      --text3:   rgba(235,235,245,0.35);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    html, body { background: var(--bg); color: var(--text); font-family: 'Plus Jakarta Sans','Noto Sans JP',sans-serif; min-height: 100dvh; }

    /* ── LOADING ── */
    #loading-screen {
      position: fixed; inset: 0; background: var(--bg);
      display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 20px; z-index: 100;
      transition: opacity .4s;
    }
    #loading-screen.hidden { opacity: 0; pointer-events: none; }
    .logo-wrap { text-align: center; }
    .logo-sub  { font-size: 10px; letter-spacing: 3px; text-transform: uppercase; color: var(--text3); font-weight: 700; margin-bottom: 8px; }
    .logo-text {
      font-size: 30px; font-weight: 800; letter-spacing: 2px;
      background: linear-gradient(90deg, var(--yellow), var(--yellow2));
      -webkit-background-clip: text; -webkit-text-fill-color: transparent;
    }
    .load-bar-wrap { width: 100px; height: 2px; background: var(--bg3); border-radius: 99px; overflow: hidden; }
    .load-bar {
      height: 100%; background: linear-gradient(90deg, var(--yellow), var(--yellow2));
      animation: barSlide 1.4s ease-in-out infinite;
    }
    @keyframes barSlide { 0%{transform:translateX(-100%)} 50%{transform:translateX(0)} 100%{transform:translateX(100%)} }
    .load-status { font-size: 11px; letter-spacing: 1.5px; text-transform: uppercase; color: var(--text3); font-weight: 600; }

    /* ── ERROR ── */
    #error-screen {
      display: none; position: fixed; inset: 0; background: var(--bg);
      flex-direction: column; align-items: center; justify-content: center;
      gap: 14px; padding: 40px; text-align: center;
    }
    #error-screen.visible { display: flex; }

    /* ── MAIN ── */
    #main { display: none; flex-direction: column; min-height: 100dvh; opacity: 0; transform: translateY(10px); transition: opacity .4s, transform .4s; }
    #main.visible { display: flex; }
    #main.shown   { opacity: 1; transform: none; }

    /* ── HEADER ── */
    .header { padding: 52px 22px 24px; display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid var(--bg3); }
    .header-left .eyebrow { font-size: 10px; letter-spacing: 2.5px; text-transform: uppercase; color: var(--text3); font-weight: 700; margin-bottom: 4px; }
    .header-left .h-logo {
      font-size: 22px; font-weight: 800; letter-spacing: 1.5px;
      background: linear-gradient(90deg, var(--yellow), var(--yellow2));
      -webkit-background-clip: text; -webkit-text-fill-color: transparent;
    }
    .header-name { font-size: 12px; color: var(--text2); font-weight: 600; }

    /* ── SECTION ── */
    .section { padding: 28px 22px 0; }
    .sec-label {
      font-size: 10px; letter-spacing: 2.5px; text-transform: uppercase; color: var(--yellow); font-weight: 700; margin-bottom: 16px;
      display: flex; align-items: center; gap: 10px;
    }
    .sec-label::after { content: ''; flex: 1; height: 1px; background: linear-gradient(90deg, var(--bg3), transparent); }

    /* ── HERO CARD ── */
    .hero-card {
      background: var(--bg2); border-radius: 20px; padding: 28px 24px;
      border: 1px solid var(--bg3); position: relative; overflow: hidden;
      text-align: center;
    }
    .hero-card::before {
      content: ''; position: absolute; top: 0; left: 0; right: 0; height: 2px;
      background: linear-gradient(90deg, transparent, var(--yellow), transparent); opacity: .6;
    }

    /* セッション中 */
    .timer-label { font-size: 10px; letter-spacing: 2px; text-transform: uppercase; color: var(--text3); font-weight: 700; margin-bottom: 6px; }
    .timer-value {
      font-size: 60px; font-weight: 800; line-height: 1; letter-spacing: 2px;
      background: linear-gradient(135deg, var(--yellow), var(--yellow2));
      -webkit-background-clip: text; -webkit-text-fill-color: transparent;
    }
    .checkin-row {
      display: flex; align-items: center; justify-content: center; gap: 8px; margin-top: 14px;
    }
    .checkin-dot {
      width: 8px; height: 8px; border-radius: 50%; background: var(--green);
      box-shadow: 0 0 8px var(--green); animation: pulse 2s ease-in-out infinite;
    }
    @keyframes pulse { 0%,100%{opacity:1;transform:scale(1)} 50%{opacity:.5;transform:scale(.8)} }
    .checkin-label { font-size: 12px; color: var(--text2); font-weight: 600; }
    .checkin-time  { font-size: 12px; color: var(--text);  font-weight: 700; }

    /* チェックイン未実施 */
    .not-started-icon { font-size: 48px; margin-bottom: 14px; }
    .not-started-title { font-size: 17px; font-weight: 800; margin-bottom: 8px; }
    .not-started-sub   { font-size: 13px; color: var(--text2); line-height: 1.7; }

    /* 完了済み */
    .already-icon  { font-size: 48px; margin-bottom: 14px; }
    .already-title { font-size: 17px; font-weight: 800; color: var(--green); margin-bottom: 6px; }
    .already-sub   { font-size: 13px; color: var(--text2); line-height: 1.7; }

    /* ── BTN ── */
    .btn-end {
      margin-top: 24px; width: 100%; padding: 18px;
      background: linear-gradient(135deg, var(--yellow), var(--yellow2));
      border: none; border-radius: 14px;
      font-family: 'Plus Jakarta Sans', sans-serif;
      font-size: 16px; font-weight: 800; color: #111; letter-spacing: .5px;
      cursor: pointer; transition: opacity .2s, transform .1s;
    }
    .btn-end:active   { opacity: .8; transform: scale(.98); }
    .btn-end:disabled { opacity: .4; cursor: not-allowed; transform: none; }

    /* ── STATS ── */
    .stats-row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .stat-card {
      background: var(--bg2); border: 1px solid var(--bg3); border-radius: 14px;
      padding: 16px; display: flex; flex-direction: column; gap: 4px;
      position: relative; overflow: hidden;
    }
    .stat-card::before {
      content: ''; position: absolute; top: 0; left: 0; right: 0; height: 2px;
      background: linear-gradient(90deg, transparent, var(--yellow), transparent); opacity: .4;
    }
    .stat-label { font-size: 9px; letter-spacing: 2px; text-transform: uppercase; color: var(--text3); font-weight: 700; }
    .stat-value {
      font-size: 38px; font-weight: 800; line-height: 1;
      background: linear-gradient(135deg, var(--yellow), var(--yellow2));
      -webkit-background-clip: text; -webkit-text-fill-color: transparent;
    }
    .stat-unit { font-size: 10px; color: var(--text3); font-weight: 700; letter-spacing: 1px; text-transform: uppercase; }

    /* ── DONE OVERLAY ── */
    #done-screen {
      display: none; position: fixed; inset: 0; background: var(--bg);
      flex-direction: column; align-items: center; justify-content: center;
      gap: 0; padding: 36px; text-align: center;
      opacity: 0; transition: opacity .5s;
    }
    #done-screen.visible { display: flex; }
    #done-screen.shown   { opacity: 1; }

    .done-check {
      width: 80px; height: 80px; border-radius: 50%;
      background: rgba(52,199,89,.12); border: 2px solid rgba(52,199,89,.4);
      display: flex; align-items: center; justify-content: center;
      font-size: 36px; margin-bottom: 22px;
      animation: popIn .5s cubic-bezier(.34,1.56,.64,1) both;
    }
    @keyframes popIn { from{transform:scale(0);opacity:0} to{transform:scale(1);opacity:1} }

    .done-title { font-size: 26px; font-weight: 800; margin-bottom: 4px; }
    .done-sub   { font-size: 13px; color: var(--text2); margin-bottom: 32px; }

    .done-stats { width: 100%; display: flex; flex-direction: column; gap: 10px; margin-bottom: 28px; }
    .done-row {
      display: flex; justify-content: space-between; align-items: center;
      background: var(--bg2); border: 1px solid var(--bg3); border-radius: 12px;
      padding: 14px 18px;
    }
    .done-row-label { font-size: 12px; color: var(--text2); font-weight: 600; }
    .done-row-value {
      font-size: 20px; font-weight: 800;
      background: linear-gradient(135deg, var(--yellow), var(--yellow2));
      -webkit-background-clip: text; -webkit-text-fill-color: transparent;
    }
    .done-msg { font-size: 13px; color: var(--text2); line-height: 1.8; }

    .pb { padding-bottom: 40px; }
  </style>
</head>
<body>

<!-- Loading -->
<div id="loading-screen">
  <div class="logo-wrap">
    <div class="logo-sub">Check Out</div>
    <div class="logo-text">hitomiru</div>
  </div>
  <div class="load-bar-wrap"><div class="load-bar"></div></div>
  <div class="load-status" id="load-status">読み込み中</div>
</div>

<!-- Error -->
<div id="error-screen">
  <div style="font-size:36px">⚠️</div>
  <div style="font-size:16px;font-weight:800">エラーが発生しました</div>
  <div style="font-size:13px;color:var(--text2);line-height:1.7" id="error-msg">しばらくして再度お試しください</div>
</div>

<!-- Done -->
<div id="done-screen">
  <div class="done-check">✓</div>
  <div class="done-title">お疲れ様でした！</div>
  <div class="done-sub" id="done-sub">コーチがすぐ確認します</div>
  <div class="done-stats">
    <div class="done-row">
      <div class="done-row-label">滞在時間</div>
      <div class="done-row-value" id="done-duration">—</div>
    </div>
    <div class="done-row">
      <div class="done-row-label">入館 → 退館</div>
      <div class="done-row-value" id="done-range">—</div>
    </div>
    <div class="done-row">
      <div class="done-row-label">連続日数 🔥</div>
      <div class="done-row-value" id="done-streak">—</div>
    </div>
    <div class="done-row">
      <div class="done-row-label">今週の達成</div>
      <div class="done-row-value" id="done-week">— / 7</div>
    </div>
  </div>
  <div class="done-msg">今日もよく動きました 💪<br>コーチからメッセージが届きます</div>
</div>

<!-- Main -->
<div id="main">
  <div class="header">
    <div class="header-left">
      <div class="eyebrow">Check Out</div>
      <div class="h-logo">hitomiru</div>
    </div>
    <div class="header-name" id="client-name"></div>
  </div>

  <!-- Hero -->
  <div class="section">
    <div class="sec-label">Session</div>
    <div class="hero-card" id="hero-card">
      <!-- JS で中身を書く -->
    </div>
  </div>

  <!-- Stats -->
  <div class="section pb">
    <div class="sec-label">Today's Stats</div>
    <div class="stats-row">
      <div class="stat-card">
        <div class="stat-label">連続日数</div>
        <div class="stat-value" id="stat-streak">—</div>
        <div class="stat-unit">days 🔥</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">今週達成</div>
        <div class="stat-value" id="stat-week">—</div>
        <div class="stat-unit">/ 7 回</div>
      </div>
    </div>
  </div>
</div>

<script>
// ═══ CONFIG ═══════════════════════════════
const LIFF_ID      = '2009941074-acGm0mti';
const SUPABASE_URL = 'https://qqgawirefsxcgrsdskpq.supabase.co';
const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InFxZ2F3aXJlZnN4Y2dyc2Rza3BxIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzQ4MTMxNTksImV4cCI6MjA5MDM4OTE1OX0.XkbN4z-0gDfkuPwiydw7crgnN2XpUSWtIGC6xD9xc5U';
const EDGE_FN      = `${SUPABASE_URL}/functions/v1/send-line-message`;
const TEST_USER_ID = 'U7992c20d68b6de12b011f21d2b2107a5';

// ═══ STATE ════════════════════════════════
let clientId   = null;
let clientName = '';
let lineUserId = null;
let startedAtValue = null;   // "HH:mm" or ISO timestamp
let logId      = null;
let timerInterval = null;

// ═══ HELPERS ══════════════════════════════
const $ = id => document.getElementById(id);
function setStatus(t) { $('load-status').textContent = t; }
function showError(t) {
  $('loading-screen').classList.add('hidden');
  $('error-msg').textContent = t;
  $('error-screen').classList.add('visible');
}
async function sbGet(path) {
  const r = await fetch(SUPABASE_URL + path, {
    headers: { apikey: SUPABASE_KEY, Authorization: 'Bearer ' + SUPABASE_KEY }
  });
  if (!r.ok) throw new Error(`HTTP ${r.status}: ${await r.text()}`);
  return r.json();
}
async function sbPatch(table, id, body) {
  const r = await fetch(`${SUPABASE_URL}/rest/v1/${table}?id=eq.${id}`, {
    method: 'PATCH',
    headers: { apikey: SUPABASE_KEY, Authorization: 'Bearer ' + SUPABASE_KEY,
               'Content-Type': 'application/json', Prefer: 'return=minimal' },
    body: JSON.stringify(body)
  });
  if (!r.ok) throw new Error(`PATCH ${r.status}: ${await r.text()}`);
}
async function sbInsert(table, body) {
  const r = await fetch(`${SUPABASE_URL}/rest/v1/${table}`, {
    method: 'POST',
    headers: { apikey: SUPABASE_KEY, Authorization: 'Bearer ' + SUPABASE_KEY,
               'Content-Type': 'application/json', Prefer: 'return=minimal' },
    body: JSON.stringify(body)
  });
  if (!r.ok) throw new Error(`INSERT ${r.status}: ${await r.text()}`);
}
function toDateStr(d) {
  return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
}
function todayStr() { return toDateStr(new Date()); }
function weekMonday() {
  const d = new Date(), day = d.getDay();
  d.setDate(d.getDate()-(day===0?6:day-1)); d.setHours(0,0,0,0); return d;
}
function nowTime() {
  return new Date().toLocaleTimeString('ja-JP', { hour: '2-digit', minute: '2-digit', hour12: false });
}
function parseTimeToMinutes(value) {
  if (!value) return null;
  const text = String(value);
  const hm = text.match(/^(\d{1,2}):(\d{2})/);
  if (hm) return Number(hm[1]) * 60 + Number(hm[2]);
  const d = new Date(text);
  if (!Number.isNaN(d.getTime())) return d.getHours() * 60 + d.getMinutes();
  return null;
}
function fmtTime(value) {
  const min = parseTimeToMinutes(value);
  if (min === null) return '—';
  return String(Math.floor(min / 60)).padStart(2, '0') + ':' + String(min % 60).padStart(2, '0');
}
function fmtElapsedFromStart(startValue) {
  const startMin = parseTimeToMinutes(startValue);
  if (startMin === null) return '00:00';
  const now = new Date();
  let diff = now.getHours() * 60 + now.getMinutes() - startMin;
  if (diff < 0) diff += 24 * 60;
  return `${String(Math.floor(diff / 60)).padStart(2, '0')}:${String(diff % 60).padStart(2, '0')}`;
}
function durationMinutes(startValue, endValue) {
  const startMin = parseTimeToMinutes(startValue);
  const endMin = parseTimeToMinutes(endValue);
  if (startMin === null || endMin === null) return 0;
  let diff = endMin - startMin;
  if (diff < 0) diff += 24 * 60;
  return diff;
}
function fmtElapsed(ms) {
  const t = Math.max(0, Math.floor(ms/1000));
  const h = Math.floor(t/3600), m = Math.floor((t%3600)/60), s = t%60;
  if (h > 0) return `${h}:${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;
  return `${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;
}
function calcStreak(logs) {
  // logs: [{date,status}] sorted desc
  let streak = 0;
  const today = todayStr();
  let expect = new Date(); expect.setHours(0,0,0,0);
  for (const log of logs) {
    const ld = new Date(log.date+'T00:00:00'); ld.setHours(0,0,0,0);
    const diff = Math.round((expect-ld)/86400000);
    if (diff > 1) break;
    if (log.status === 'completed') {
      streak++;
      expect = new Date(ld); expect.setDate(ld.getDate()-1);
    } else if (log.date === today) {
      expect = new Date(ld); expect.setDate(ld.getDate()-1);
    } else break;
  }
  return streak;
}

// ═══ TIMER ════════════════════════════════
function startTimer() {
  if (timerInterval) clearInterval(timerInterval);
  timerInterval = setInterval(() => {
    if (!startedAtValue) return;
    const el = document.getElementById('timer-value');
    if (el) el.textContent = fmtElapsedFromStart(startedAtValue);
  }, 1000);
}

// ═══ RENDER HERO ══════════════════════════
function renderHeroInProgress(log) {
  startedAtValue = log.started_at;
  $('hero-card').innerHTML = `
    <div class="timer-label">経過時間</div>
    <div class="timer-value" id="timer-value">${fmtElapsedFromStart(startedAtValue)}</div>
    <div class="checkin-row">
      <div class="checkin-dot"></div>
      <div class="checkin-label">入館時刻</div>
      <div class="checkin-time">&nbsp;${fmtTime(log.started_at)}</div>
    </div>
    <button class="btn-end" id="btn-end" onclick="handleCheckout()">🏁 セッション終了</button>
  `;
  startTimer();
}
function renderHeroNotStarted() {
  $('hero-card').innerHTML = `
    <div class="not-started-icon">🏋️</div>
    <div class="not-started-title">チェックインがまだです</div>
    <div class="not-started-sub">先に「📷 着いた」から<br>入館を記録してください</div>
  `;
}
function renderHeroCompleted(log) {
  const min = durationMinutes(log.started_at, log.completed_at);
  $('hero-card').innerHTML = `
    <div class="already-icon">✅</div>
    <div class="already-title">本日のセッション完了</div>
    <div class="already-sub">${fmtTime(log.started_at)} → ${fmtTime(log.completed_at)}（${min}分）</div>
  `;
}

// ═══ CHECKOUT ═════════════════════════════
async function handleCheckout() {
  const btn = $('btn-end');
  btn.disabled = true; btn.textContent = '記録中...';
  const now = nowTime();
  const today = todayStr();
  try {
    await sbPatch('daily_logs', logId, { status: 'completed', completed_at: now, updated_at: new Date().toISOString() });
    await sbInsert('events', {
      client_id: clientId, date: today,
      type: 'user_completed',
      message: `${clientName}さんが退館しました`, is_new: true
    });
    const min = durationMinutes(startedAtValue, now);
    const msg = `🏁 ${clientName}さん、お疲れ様でした！\n滞在時間：${min}分\nコーチが確認次第メッセージをお送りしますね 💪`;
    fetch(EDGE_FN, {
      method: 'POST',
      headers: { apikey: SUPABASE_KEY, 'Content-Type': 'application/json', Authorization: 'Bearer '+SUPABASE_KEY },
      body: JSON.stringify({ lineUserId, message: msg })
    }).catch(()=>{});

    await showDone(now, min, today);
  } catch(e) {
    btn.disabled = false; btn.textContent = '🏁 セッション終了';
    alert('エラー: ' + e.message);
  }
}

async function showDone(completedIso, min, today) {
  if (timerInterval) clearInterval(timerInterval);
  const [allLogs, weekLogs] = await Promise.all([
    sbGet(`/rest/v1/daily_logs?client_id=eq.${clientId}&select=date,status&order=date.desc&limit=200`),
    sbGet(`/rest/v1/daily_logs?client_id=eq.${clientId}&date=gte.${toDateStr(weekMonday())}&select=date,status&order=date.desc`)
  ]).catch(() => [[],[]]);
  const streak   = calcStreak(allLogs);
  const weekDone = weekLogs.filter(l=>l.status==='completed').length;

  $('done-sub').textContent = clientName + ' さん';
  $('done-duration').textContent = min + ' 分';
  $('done-range').textContent    = fmtTime(startedAtValue) + ' → ' + fmtTime(completedIso);
  $('done-streak').textContent   = streak + ' days';
  $('done-week').textContent     = weekDone + ' / 7';

  $('main').classList.remove('visible','shown');
  $('done-screen').classList.add('visible');
  requestAnimationFrame(()=>setTimeout(()=>$('done-screen').classList.add('shown'),20));
}

// ═══ MAIN ═════════════════════════════════
async function main() {
  setStatus('起動中...');

  // LIFF（失敗してもフォールバック）
  try {
    await Promise.race([
      liff.init({ liffId: LIFF_ID }),
      new Promise((_,rej)=>setTimeout(rej,5000))
    ]);
    if (liff.isLoggedIn()) lineUserId = (await liff.getProfile()).userId;
  } catch(_) {}
  if (!lineUserId) lineUserId = TEST_USER_ID;

  // Client
  setStatus('データ取得中...');
  try {
    const safeUserId = encodeURIComponent(lineUserId);
    const clients = await sbGet(`/rest/v1/clients?or=(token.eq.${safeUserId},line_user_id.eq.${safeUserId})&select=id,name,status,plan_end_date&limit=1`);
    if (!clients.length) throw new Error('このアカウントは登録されていません');
    const client = clients[0];
    if (['lead', 'expired', 'cancelled'].includes(client.status)) {
      throw new Error('このアカウントはまだ利用開始前、または利用期間外です');
    }
    if (client.plan_end_date && todayStr() > client.plan_end_date && client.status === 'monitor') {
      throw new Error('モニター期間が終了しています');
    }
    clientId = client.id; clientName = client.name;
    $('client-name').textContent = clientName;
  } catch(e) { showError(e.message); return; }

  // Logs
  const today = todayStr();
  try {
    const [todayLogs, allLogs, weekLogs] = await Promise.all([
      sbGet(`/rest/v1/daily_logs?client_id=eq.${clientId}&date=eq.${today}&select=*&order=id.desc&limit=1`),
      sbGet(`/rest/v1/daily_logs?client_id=eq.${clientId}&select=date,status&order=date.desc&limit=200`),
      sbGet(`/rest/v1/daily_logs?client_id=eq.${clientId}&date=gte.${toDateStr(weekMonday())}&select=date,status&order=date.desc`),
    ]);

    // Stats
    $('stat-streak').textContent = calcStreak(allLogs);
    $('stat-week').textContent   = weekLogs.filter(l=>l.status==='completed').length;

    const log = todayLogs[0];
    if (!log || !log.started_at) {
      renderHeroNotStarted();
    } else if (log.status === 'in_progress' || (log.started_at && !log.completed_at)) {
      logId = log.id;
      renderHeroInProgress(log);
    } else if (log.status === 'completed' || log.completed_at) {
      renderHeroCompleted(log);
    } else {
      renderHeroNotStarted();
    }

  } catch(e) { showError('データ取得に失敗しました: ' + e.message); return; }

  $('loading-screen').classList.add('hidden');
  $('main').classList.add('visible');
  requestAnimationFrame(()=>setTimeout(()=>$('main').classList.add('shown'),20));
}

window.handleCheckout = handleCheckout;
window.addEventListener('load', main);
</script>
</body>
</html>
