<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#FFC107">
<title>hitomiru - checkout</title>
<script charset="utf-8" src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&family=Noto+Sans+JP:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root {
  --yellow: #FFC107; --yellow-deep: #FFB300; --yellow-glow: #FFECB3;
  --dark: #1C1C1E; --dark2: #2C2C2E; --gray: #8E8E93;
  --white: #FFFFFF; --success: #30D158; --font: 'Plus Jakarta Sans', 'Noto Sans JP', -apple-system, sans-serif;
}
* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
html, body {
  width: 100%; height: 100vh; height: 100dvh; overflow: hidden;
  background: var(--dark); color: var(--white);
  font-family: var(--font); -webkit-font-smoothing: antialiased;
  user-select: none; -webkit-user-select: none;
}
.screen { position: fixed; inset: 0; display: flex; flex-direction: column; }
.screen.hidden { display: none; }
.nav {
  padding: 16px 20px; padding-top: max(16px, env(safe-area-inset-top));
  display: flex; align-items: center; justify-content: space-between;
  background: var(--dark);
}
.nav-logo {
  font-size: 22px; font-weight: 800; letter-spacing: -0.03em;
  background: linear-gradient(135deg, var(--yellow), #FFD54F);
  -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;
}
.nav-pill {
  font-size: 10px; font-weight: 700; letter-spacing: 0.12em; text-transform: uppercase;
  color: var(--dark); background: var(--yellow); padding: 5px 12px; border-radius: 20px;
}
#confirm-screen {
  background: linear-gradient(180deg, var(--dark) 0%, #262626 100%);
  justify-content: space-between;
}
.hero {
  flex: 1; display: flex; flex-direction: column;
  justify-content: center; align-items: center;
  padding: 0 34px; text-align: center;
}
.hero-circle {
  width: 140px; height: 140px; border-radius: 50%;
  background: radial-gradient(circle at 30% 30%, var(--yellow-glow), var(--yellow));
  display: flex; align-items: center; justify-content: center; margin-bottom: 32px;
  box-shadow: 0 12px 40px rgba(255, 193, 7, 0.35), 0 0 80px rgba(255, 193, 7, 0.15);
  animation: pulse 2.5s ease-in-out infinite;
}
@keyframes pulse {
  0%, 100% { box-shadow: 0 12px 40px rgba(255,193,7,0.35), 0 0 80px rgba(255,193,7,0.15); }
  50% { box-shadow: 0 16px 60px rgba(255,193,7,0.5), 0 0 120px rgba(255,193,7,0.25); }
}
.hero-circle svg { width: 54px; height: 54px; color: var(--dark); }
.hero-title {
  font-size: 26px; font-weight: 800; letter-spacing: -0.02em;
  line-height: 1.35; margin-bottom: 14px;
}
.hero-title em {
  font-style: normal;
  background: linear-gradient(135deg, var(--yellow), #FFD54F);
  -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;
}
.hero-sub { font-size: 14px; color: var(--gray); line-height: 1.7; margin-bottom: 20px; }
.session-mini {
  width: 100%; max-width: 320px;
  background: rgba(255,255,255,0.055); border: 1px solid rgba(255,255,255,0.1);
  border-radius: 20px; padding: 18px 20px; display: none;
}
.session-mini-row { display: flex; justify-content: space-between; align-items: center; padding: 7px 0; }
.session-mini-label { font-size: 12px; color: var(--gray); }
.session-mini-value { font-size: 16px; font-weight: 800; color: var(--yellow); }
.bottom {
  padding: 16px 20px; padding-bottom: max(16px, env(safe-area-inset-bottom));
  background: var(--dark);
}
.btn-main {
  width: 100%; padding: 18px;
  background: linear-gradient(135deg, var(--yellow), var(--yellow-deep));
  color: var(--dark); border: none; border-radius: 16px;
  font-family: var(--font); font-size: 16px; font-weight: 800;
  letter-spacing: 0.02em; cursor: pointer;
  display: flex; align-items: center; justify-content: center; gap: 10px;
  box-shadow: 0 6px 24px rgba(255, 193, 7, 0.3);
  transition: transform 0.12s ease, box-shadow 0.12s ease;
}
.btn-main:active { transform: scale(0.97); box-shadow: 0 3px 12px rgba(255, 193, 7, 0.2); }
.btn-main:disabled { opacity: 0.3; cursor: not-allowed; transform: none; box-shadow: none; }
.message-box {
  margin: 0 20px 12px; padding: 14px 16px;
  border-radius: 12px; font-size: 13px; line-height: 1.5; display: none; white-space: pre-line;
}
.message-box.show { display: block; }
.message-box.error {
  background: rgba(255, 69, 58, 0.12); border: 1px solid rgba(255, 69, 58, 0.3); color: #FF6961;
}
.message-box.warning {
  background: rgba(255,193,7,0.1); border: 1px solid rgba(255,193,7,0.3); color: var(--yellow);
}
#done-screen {
  background: var(--dark);
  justify-content: center; align-items: center; padding: 0 36px;
}
.done-wrap { text-align: center; width: 100%; max-width: 360px; }
.done-ring {
  width: 100px; height: 100px; border-radius: 50%;
  background: linear-gradient(135deg, var(--success), #4ADE80);
  margin: 0 auto 28px; display: flex; align-items: center; justify-content: center;
  box-shadow: 0 8px 32px rgba(48,209,88,0.3);
  animation: popIn 0.5s cubic-bezier(0.34, 1.56, 0.64, 1) backwards;
}
@keyframes popIn { 0% { transform: scale(0); opacity: 0; } 100% { transform: scale(1); opacity: 1; } }
.done-ring svg { width: 44px; height: 44px; color: var(--white); }
.done-title { font-size: 24px; font-weight: 800; letter-spacing: -0.02em; margin-bottom: 6px; animation: up 0.4s ease 0.2s backwards; }
.done-time { font-size: 14px; color: var(--gray); margin-bottom: 28px; animation: up 0.4s ease 0.3s backwards; }
.session-card {
  background: linear-gradient(135deg, rgba(255,193,7,0.12), rgba(255,193,7,0.04));
  border: 1px solid rgba(255,193,7,0.25);
  border-radius: 20px; padding: 24px; margin-bottom: 18px;
  animation: up 0.4s ease 0.4s backwards;
}
.session-label { font-size: 10px; font-weight: 700; letter-spacing: 0.15em; color: var(--yellow); margin-bottom: 8px; }
.session-duration { font-size: 40px; font-weight: 800; letter-spacing: -0.03em; line-height: 1; color: var(--yellow); }
.session-duration-unit { font-size: 13px; color: var(--gray); margin-left: 4px; font-weight: 600; }
.session-time-range { font-size: 13px; color: var(--gray); margin-top: 10px; }
.stats-row { display: flex; gap: 12px; margin-bottom: 28px; animation: up 0.4s ease 0.5s backwards; }
.stat-box {
  flex: 1; background: rgba(255,255,255,0.055); border: 1px solid rgba(255,255,255,0.1);
  border-radius: 16px; padding: 16px 12px; text-align: center;
}
.stat-label { font-size: 10px; color: var(--gray); letter-spacing: 0.12em; margin-bottom: 6px; }
.stat-value { font-size: 20px; font-weight: 800; color: var(--yellow); }
.done-message { font-size: 13px; color: var(--gray); line-height: 1.7; animation: up 0.4s ease 0.6s backwards; }
@keyframes up { 0% { transform: translateY(16px); opacity: 0; } 100% { transform: translateY(0); opacity: 1; } }
.loading-overlay {
  position: fixed; inset: 0;
  background: rgba(28,28,30,0.97); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
  display: none; flex-direction: column; align-items: center; justify-content: center; z-index: 100;
}
.loading-overlay.show { display: flex; }
.spinner {
  width: 36px; height: 36px;
  border: 3px solid rgba(255,193,7,0.15); border-top-color: var(--yellow);
  border-radius: 50%; animation: spin 0.7s linear infinite; margin-bottom: 14px;
}
@keyframes spin { to { transform: rotate(360deg); } }
.loading-text { font-size: 13px; color: var(--gray); }
</style>
</head>
<body>

<div class="screen" id="confirm-screen">
  <div class="nav">
    <div class="nav-logo">hitomiru</div>
    <div class="nav-pill">Check out</div>
  </div>
  <div class="hero">
    <div class="hero-circle">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
    </div>
    <div class="hero-title">ジム、<em>終わりましたか？</em></div>
    <div class="hero-sub" id="confirm-subtitle">今日のセッションを終了します。</div>
    <div class="session-mini" id="confirm-stats">
      <div class="session-mini-row">
        <div class="session-mini-label">開始時刻</div>
        <div class="session-mini-value" id="confirm-start-time">--:--</div>
      </div>
      <div class="session-mini-row">
        <div class="session-mini-label">経過時間</div>
        <div class="session-mini-value" id="confirm-duration">--分</div>
      </div>
    </div>
  </div>
  <div class="message-box warning" id="warning-message"></div>
  <div class="message-box error" id="error-message"></div>
  <div class="bottom">
    <button class="btn-main" id="finish-btn" disabled>
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
      チェックアウトする
    </button>
  </div>
</div>

<div class="screen hidden" id="done-screen">
  <div class="done-wrap">
    <div class="done-ring">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>
    </div>
    <div class="done-title" id="done-name">お疲れ様です！</div>
    <div class="done-time">今日のセッション完了</div>
    <div class="session-card">
      <div class="session-label">TODAY'S SESSION</div>
      <div class="session-duration">
        <span id="session-duration-value">--</span><span class="session-duration-unit">分</span>
      </div>
      <div class="session-time-range" id="session-time-range">--:-- → --:--</div>
    </div>
    <div class="stats-row">
      <div class="stat-box">
        <div class="stat-label">CONTINUOUS</div>
        <div class="stat-value" id="streak-value">-日 🔥</div>
      </div>
      <div class="stat-box">
        <div class="stat-label">THIS WEEK</div>
        <div class="stat-value" id="week-value">-/-</div>
      </div>
    </div>
    <div class="done-message">
      コーチに通知が飛びました ✨<br>
      ゆっくり休んでください 🌙
    </div>
  </div>
</div>

<div class="loading-overlay" id="loading">
  <div class="spinner"></div>
  <div class="loading-text" id="loading-text">読み込み中...</div>
</div>

<script>
const LIFF_ID = '2009941074-acGm0mti'; 
const SUPABASE_URL = 'https://qqgawirefsxcgrsdskpq.supabase.co';
const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InFxZ2F3aXJlZnN4Y2dyc2Rza3BxIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzQ4MTMxNTksImV4cCI6MjA5MDM4OTE1OX0.XkbN4z-0gDfkuPwiydw7crgnN2XpUSWtIGC6xD9xc5U';
const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

const confirmScreen = document.getElementById('confirm-screen');
const doneScreen = document.getElementById('done-screen');
const finishBtn = document.getElementById('finish-btn');
const loading = document.getElementById('loading');
const loadingText = document.getElementById('loading-text');
const errorMessage = document.getElementById('error-message');
const warningMessage = document.getElementById('warning-message');
const confirmSubtitle = document.getElementById('confirm-subtitle');
const confirmStats = document.getElementById('confirm-stats');

let clientId = null;
let clientName = '';
let lineUserId = '';
let todayLog = null;
let alreadyCompleted = false;

window.addEventListener('load', async () => {
  showLoading('読み込み中...');
  
  try {
    await liff.init({ liffId: LIFF_ID });
    
    if (!liff.isLoggedIn()) {
      liff.login();
      return;
    }
    
    const profile = await liff.getProfile();
    lineUserId = profile.userId;
    
    const { data: client, error: clientErr } = await supabase
      .from('clients')
      .select('*')
      .or(`line_user_id.eq.${lineUserId},token.eq.${lineUserId}`)
      .maybeSingle();
    
    if (clientErr || !client) {
      showUnavailable('ヒトミルは現在、モニター登録者のみ利用できます。\nモニター希望の方は、LINEで「モニター」と送ってください。');
      hideLoading();
      return;
    }

    const status = client.status || 'monitor';
    const todayForStatus = todayJST();
    const ended = client.plan_end_date && todayForStatus > client.plan_end_date && status === 'monitor';
    if (['lead', 'expired', 'cancelled'].includes(status) || ended) {
      showUnavailable('ヒトミルのモニター期間が終了しました。\n継続希望の方は、LINEで「継続」と送ってください。');
      hideLoading();
      return;
    }
    
    clientId = client.id;
    clientName = client.name;
    
    const today = todayJST();
    const { data: log } = await supabase
      .from('daily_logs')
      .select('*')
      .eq('client_id', clientId)
      .eq('date', today)
      .maybeSingle();
    
    todayLog = log;
    
    if (!log || !log.started_at) {
      showWarning('チェックイン記録はまだありません。\nこのままチェックアウト記録だけ残すこともできます。');
      confirmStats.style.display = 'block';
      document.getElementById('confirm-start-time').textContent = '--:--';
      document.getElementById('confirm-duration').textContent = '--分';
      finishBtn.textContent = '🏁 チェックアウトする';
      finishBtn.disabled = false;
    } else if (log.status === 'completed' || log.completed_at) {
      alreadyCompleted = true;
      showWarning('今日のセッションは既に記録済みです ✨');
      finishBtn.disabled = false;
      finishBtn.textContent = '記録を確認する';
      finishBtn.style.opacity = '1';
      
      confirmStats.style.display = 'block';
      document.getElementById('confirm-start-time').textContent = log.started_at;
      document.getElementById('confirm-duration').textContent = calcDurationLabel(log.started_at, log.completed_at);
      confirmSubtitle.textContent = '今日のセッション';
    } else {
      confirmStats.style.display = 'block';
      document.getElementById('confirm-start-time').textContent = log.started_at;
      finishBtn.disabled = false;
      updateElapsed();
      setInterval(updateElapsed, 30000);
    }
    
    hideLoading();
  } catch (e) {
    console.error(e);
    showError('LINE連携エラー: ' + (e.message || ''));
    hideLoading();
  }
});

function updateElapsed() {
  if (!todayLog || !todayLog.started_at) return;
  const startMin = parseTimeToMinutes(todayLog.started_at);
  const now = new Date();
  const nowMin = now.getHours() * 60 + now.getMinutes();
  const elapsed = Math.max(0, nowMin - startMin);
  document.getElementById('confirm-duration').textContent = `${elapsed}分`;
}

function parseTimeToMinutes(timeStr) {
  if (!timeStr) return 0;
  const [h, m] = timeStr.split(':').map(Number);
  return h * 60 + m;
}

function showError(msg) {
  errorMessage.textContent = msg;
  errorMessage.classList.add('show');
}
function showWarning(msg) {
  warningMessage.textContent = msg;
  warningMessage.classList.add('show');
}
function showUnavailable(msg) {
  confirmSubtitle.textContent = msg;
  confirmStats.style.display = 'none';
  finishBtn.disabled = true;
  finishBtn.textContent = 'LINEで相談してください';
  showWarning(msg);
}

finishBtn.addEventListener('click', async () => {
  showLoading('記録中...');
  
  try {
    const today = todayJST();
    const nowTimeStr = nowTimeJP();

    const { data: latestLog, error: latestErr } = await supabase
      .from('daily_logs')
      .select('*')
      .eq('client_id', clientId)
      .eq('date', today)
      .maybeSingle();
    if (latestErr) throw latestErr;
    todayLog = latestLog || todayLog;

    if (alreadyCompleted && todayLog && todayLog.completed_at) {
      hideLoading();
      showDone(todayLog.completed_at);
      return;
    }
    
    if (todayLog) {
      const { error } = await supabase
        .from('daily_logs')
        .update({
          status: 'completed',
          completed_at: nowTimeStr,
          updated_at: new Date().toISOString()
        })
        .eq('id', todayLog.id);
      if (error) throw error;
      todayLog = { ...todayLog, status: 'completed', completed_at: nowTimeStr };
    } else {
      const { data: newLog, error } = await supabase
        .from('daily_logs')
        .insert({
          client_id: clientId,
          date: today,
          status: 'completed',
          completed_at: nowTimeStr,
          task: 'ジムに行く'
        })
        .select()
        .single();
      if (error) throw error;
      todayLog = newLog;
    }
    
    const { error: evtErr } = await supabase
      .from('events')
      .insert({
        client_id: clientId,
        date: today,
        type: 'user_completed',
        message: todayLog && todayLog.started_at
          ? `${clientName}さんがチェックアウトしました 🏁`
          : `${clientName}さんがチェックアウトしました（チェックイン記録なし）🏁`,
        is_new: true
      });
    if (evtErr) throw evtErr;

    await sendCheckoutLine(nowTimeStr);
    
    hideLoading();
    showDone(nowTimeStr);
  } catch (e) {
    hideLoading();
    console.error(e);
    alert('送信に失敗しました: ' + e.message);
  }
});

async function sendCheckoutLine(endTimeStr) {
  if (!lineUserId) return;

  const durationLabel = todayLog && todayLog.started_at
    ? calcDurationLabel(todayLog.started_at, endTimeStr)
    : 'チェックイン記録なし';

  try {
    await supabase.functions.invoke('send-line-message', {
      body: {
        lineUserId,
        message: `🏁 ${clientName}さん、チェックアウト完了\n\n終了時刻：${endTimeStr}\n滞在時間：${durationLabel}\n\n今日もジムまで行けました。\nここまで来た時点で、かなり大きいです。\n\nゆっくり休んでください🌙`
      }
    });
  } catch (lineErr) {
    console.log('LINE送信エラー（無視可）:', lineErr);
  }
}

async function showDone(endTimeStr) {
  confirmScreen.classList.add('hidden');
  doneScreen.classList.remove('hidden');
  
  document.getElementById('done-name').textContent = `${clientName}さん、お疲れ様！`;
  
  let durationMin = 0;
  let startTimeStr = '--:--';
  
  if (todayLog && todayLog.started_at) {
    startTimeStr = todayLog.started_at;
    const startMin = parseTimeToMinutes(todayLog.started_at);
    const endMin = parseTimeToMinutes(endTimeStr);
    durationMin = Math.max(0, endMin - startMin);
  }
  
  document.getElementById('session-duration-value').textContent = durationMin || '0';
  document.getElementById('session-time-range').textContent = `${startTimeStr} → ${endTimeStr}`;
  
  try {
    const stats = await calculateStreak();
    document.getElementById('streak-value').textContent = `${stats.streak}回目 🔥`;
    document.getElementById('week-value').textContent = `${stats.weekDone}/${stats.weekTotal}`;
  } catch (e) {
    console.error('streak calc failed', e);
  }
}

async function calculateStreak() {
  const today = new Date();
  const todayStr = todayJST();
  const thirtyDaysAgo = new Date(today);
  thirtyDaysAgo.setDate(thirtyDaysAgo.getDate() - 30);
  const thirtyDaysAgoStr = thirtyDaysAgo.toISOString().split('T')[0];
  
  const { data: logs } = await supabase
    .from('daily_logs')
    .select('date, status')
    .eq('client_id', clientId)
    .gte('date', thirtyDaysAgoStr)
    .lte('date', todayStr)
    .order('date', { ascending: false });
  
  const success = ['in_progress', 'completed'];
  const planned = ['scheduled', 'in_progress', 'completed', 'missed', 'rescheduled'];
  const plannedLogs = (logs || []).filter(l => planned.includes(l.status));
  let streak = 0;
  for (const log of plannedLogs) {
    if (success.includes(log.status)) streak++;
    else break;
  }
  
  const dayOfWeek = today.getDay();
  const daysSinceMonday = dayOfWeek === 0 ? 6 : dayOfWeek - 1;
  const monday = new Date(today);
  monday.setDate(monday.getDate() - daysSinceMonday);
  const mondayStr = monday.toISOString().split('T')[0];
  
  const weekPlanned = plannedLogs.filter(l => l.date >= mondayStr && l.date <= todayStr);
  const weekDone = weekPlanned.filter(l => success.includes(l.status)).length;
  
  const weekTotal = Math.max(weekPlanned.length, weekDone, 1);
  
  return { streak: Math.max(streak, 1), weekDone, weekTotal };
}

function todayJST() {
  const now = new Date();
  const y = now.getFullYear();
  const m = String(now.getMonth() + 1).padStart(2, '0');
  const d = String(now.getDate()).padStart(2, '0');
  return `${y}-${m}-${d}`;
}

function nowTimeJP() {
  return new Date().toLocaleTimeString('ja-JP', {
    hour: '2-digit',
    minute: '2-digit',
    hour12: false
  });
}

function calcDurationLabel(startTimeStr, endTimeStr) {
  if (!startTimeStr || !endTimeStr) return '--分';
  const startMin = parseTimeToMinutes(startTimeStr);
  const endMin = parseTimeToMinutes(endTimeStr);
  return `${Math.max(0, endMin - startMin)}分`;
}

function showLoading(text) {
  loadingText.textContent = text || '送信中...';
  loading.classList.add('show');
}
function hideLoading() {
  loading.classList.remove('show');
}
</script>
</body>
</html>
