<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#1a1a1a">
<title>ヒトミル - 帰る</title>
<script charset="utf-8" src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  html, body {
    width: 100%; height: 100vh; height: 100dvh; overflow: hidden;
    background: #0a0a0a; color: #fff;
    font-family: -apple-system, BlinkMacSystemFont, 'Hiragino Sans', sans-serif;
    user-select: none; -webkit-user-select: none;
  }
  .screen { position: fixed; inset: 0; display: flex; flex-direction: column; background: #0a0a0a; }
  .screen.hidden { display: none; }
  .header {
    padding: 20px 24px 16px;
    padding-top: max(20px, env(safe-area-inset-top));
    display: flex; align-items: center; justify-content: space-between;
  }
  .logo { font-size: 18px; font-weight: 700; letter-spacing: 0.05em; }
  .logo .accent { color: #FFB800; }
  .step-indicator { font-size: 13px; color: #888; letter-spacing: 0.1em; }
  
  #confirm-screen { justify-content: space-between; }
  .confirm-content {
    flex: 1; display: flex; flex-direction: column; justify-content: center;
    align-items: center; padding: 0 32px; text-align: center;
  }
  .confirm-icon { font-size: 64px; margin-bottom: 32px; filter: drop-shadow(0 0 20px rgba(255, 184, 0, 0.3)); }
  .confirm-title { font-size: 28px; font-weight: 700; line-height: 1.4; margin-bottom: 16px; }
  .confirm-subtitle { font-size: 15px; color: #aaa; line-height: 1.6; margin-bottom: 32px; }
  .confirm-stats {
    background: rgba(255, 255, 255, 0.05);
    border: 1px solid rgba(255, 255, 255, 0.1);
    border-radius: 16px; padding: 24px; width: 100%; max-width: 320px;
  }
  .confirm-stats-row { display: flex; justify-content: space-between; align-items: center; padding: 8px 0; }
  .confirm-stats-label { font-size: 14px; color: #888; }
  .confirm-stats-value { font-size: 16px; font-weight: 600; color: #FFB800; }
  
  .button-area { padding: 24px; padding-bottom: max(24px, env(safe-area-inset-bottom)); }
  .primary-button {
    width: 100%; padding: 20px; background: #FFB800; color: #0a0a0a;
    border: none; border-radius: 16px; font-size: 18px; font-weight: 700;
    letter-spacing: 0.05em; cursor: pointer;
    box-shadow: 0 8px 24px rgba(255, 184, 0, 0.3);
    transition: transform 0.1s ease;
  }
  .primary-button:active { transform: scale(0.97); }
  .primary-button:disabled { opacity: 0.4; cursor: not-allowed; }
  
  #done-screen { justify-content: center; align-items: center; padding: 0 32px; }
  .done-content { text-align: center; width: 100%; max-width: 400px; }
  .check-circle {
    width: 96px; height: 96px; border-radius: 50%; background: #FFB800;
    margin: 0 auto 32px; display: flex; align-items: center; justify-content: center;
    animation: pop 0.5s cubic-bezier(0.34, 1.56, 0.64, 1) backwards;
  }
  @keyframes pop { 0% { transform: scale(0); opacity: 0; } 100% { transform: scale(1); opacity: 1; } }
  .check-mark { color: #0a0a0a; font-size: 48px; font-weight: 700; }
  .done-title { font-size: 32px; font-weight: 700; margin-bottom: 8px; animation: slideUp 0.4s ease 0.2s backwards; }
  .done-subtitle { font-size: 16px; color: #888; margin-bottom: 32px; animation: slideUp 0.4s ease 0.3s backwards; }
  .session-card {
    background: linear-gradient(135deg, rgba(255, 184, 0, 0.15), rgba(255, 184, 0, 0.05));
    border: 1px solid rgba(255, 184, 0, 0.3);
    border-radius: 16px; padding: 24px; margin-bottom: 24px;
    animation: slideUp 0.4s ease 0.4s backwards;
  }
  .session-label { font-size: 13px; color: #FFB800; letter-spacing: 0.1em; margin-bottom: 8px; text-align: center; }
  .session-duration { font-size: 48px; font-weight: 700; margin-bottom: 4px; text-align: center; line-height: 1; }
  .session-duration-unit { font-size: 16px; color: #aaa; margin-left: 4px; font-weight: 400; }
  .session-time-range { font-size: 13px; color: #aaa; text-align: center; margin-top: 8px; }
  .stats-row { display: flex; gap: 12px; margin-bottom: 32px; animation: slideUp 0.4s ease 0.5s backwards; }
  .stat-box {
    flex: 1; background: rgba(255, 255, 255, 0.05);
    border: 1px solid rgba(255, 255, 255, 0.1);
    border-radius: 12px; padding: 16px 12px; text-align: center;
  }
  .stat-label { font-size: 11px; color: #888; letter-spacing: 0.1em; margin-bottom: 6px; }
  .stat-value { font-size: 22px; font-weight: 700; }
  .done-message { font-size: 14px; color: #888; line-height: 1.6; animation: slideUp 0.4s ease 0.6s backwards; }
  @keyframes slideUp { 0% { transform: translateY(20px); opacity: 0; } 100% { transform: translateY(0); opacity: 1; } }
  
  .loading-overlay {
    position: fixed; inset: 0; background: rgba(10, 10, 10, 0.95);
    backdrop-filter: blur(8px); display: none;
    flex-direction: column; align-items: center; justify-content: center; z-index: 100;
  }
  .loading-overlay.show { display: flex; }
  .spinner {
    width: 40px; height: 40px;
    border: 3px solid rgba(255, 184, 0, 0.2);
    border-top-color: #FFB800;
    border-radius: 50%; animation: spin 1s linear infinite; margin-bottom: 16px;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  .loading-text { font-size: 14px; color: #888; }
  .error-message {
    background: rgba(255, 60, 60, 0.15); border: 1px solid rgba(255, 60, 60, 0.4);
    border-radius: 12px; padding: 16px; margin: 20px 24px;
    font-size: 14px; color: #ff8888; display: none;
  }
  .error-message.show { display: block; }
  .warning-message {
    background: rgba(255, 165, 0, 0.1); border: 1px solid rgba(255, 165, 0, 0.3);
    border-radius: 12px; padding: 16px; margin: 20px 24px;
    font-size: 14px; color: #ffaa44; line-height: 1.5; display: none;
  }
  .warning-message.show { display: block; }
</style>
</head>
<body>

<div class="screen" id="confirm-screen">
  <div class="header">
    <div class="logo">ヒトミル<span class="accent">.</span></div>
    <div class="step-indicator">FINISH</div>
  </div>
  <div class="confirm-content">
    <div class="confirm-icon">🏁</div>
    <div class="confirm-title">お疲れ様です！<br>今日もえらいです ✨</div>
    <div class="confirm-subtitle" id="confirm-subtitle">セッションを終了しますか？</div>
    <div class="confirm-stats" id="confirm-stats" style="display: none;">
      <div class="confirm-stats-row">
        <div class="confirm-stats-label">入館時刻</div>
        <div class="confirm-stats-value" id="confirm-start-time">--:--</div>
      </div>
      <div class="confirm-stats-row">
        <div class="confirm-stats-label">経過時間</div>
        <div class="confirm-stats-value" id="confirm-duration">--分</div>
      </div>
    </div>
  </div>
  <div class="warning-message" id="warning-message"></div>
  <div class="error-message" id="error-message"></div>
  <div class="button-area">
    <button class="primary-button" id="finish-btn" disabled>🏁 セッション終了</button>
  </div>
</div>

<div class="screen hidden" id="done-screen">
  <div class="done-content">
    <div class="check-circle"><div class="check-mark">✓</div></div>
    <div class="done-title" id="done-name">お疲れ様です！</div>
    <div class="done-subtitle">今日のセッション完了 🔥</div>
    <div class="session-card">
      <div class="session-label">TODAY'S SESSION</div>
      <div class="session-duration">
        <span id="session-duration-value">--</span><span class="session-duration-unit">分</span>
      </div>
      <div class="session-time-range" id="session-time-range">--:-- → --:--</div>
    </div>
    <div class="stats-row">
      <div class="stat-box">
        <div class="stat-label">CONTINUOUS</div>
        <div class="stat-value" id="streak-value">-日 🔥</div>
      </div>
      <div class="stat-box">
        <div class="stat-label">THIS WEEK</div>
        <div class="stat-value" id="week-value">-/-</div>
      </div>
    </div>
    <div class="done-message">
      コーチに通知が飛びました ✨<br>
      ゆっくり休んでください 🌙
    </div>
  </div>
</div>

<div class="loading-overlay" id="loading">
  <div class="spinner"></div>
  <div class="loading-text" id="loading-text">読み込み中...</div>
</div>

<script>
const LIFF_ID = '2009941074-acGm0mti'; // ★差し替え★
const SUPABASE_URL = 'https://qqgawirefsxcgrsdskpq.supabase.co';
const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InFxZ2F3aXJlZnN4Y2dyc2Rza3BxIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzQ4MTMxNTksImV4cCI6MjA5MDM4OTE1OX0.XkbN4z-0gDfkuPwiydw7crgnN2XpUSWtIGC6xD9xc5U';
const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

const confirmScreen = document.getElementById('confirm-screen');
const doneScreen = document.getElementById('done-screen');
const finishBtn = document.getElementById('finish-btn');
const loading = document.getElementById('loading');
const loadingText = document.getElementById('loading-text');
const errorMessage = document.getElementById('error-message');
const warningMessage = document.getElementById('warning-message');
const confirmSubtitle = document.getElementById('confirm-subtitle');
const confirmStats = document.getElementById('confirm-stats');

let clientId = null;
let clientName = '';
let todayLog = null;

window.addEventListener('load', async () => {
  showLoading('読み込み中...');
  
  try {
    await liff.init({ liffId: LIFF_ID });
    
    if (!liff.isLoggedIn()) {
      liff.login();
      return;
    }
    
    const profile = await liff.getProfile();
    const lineUserId = profile.userId;
    
    const { data: client, error: clientErr } = await supabase
      .from('clients')
      .select('id, name')
      .or(`line_user_id.eq.${lineUserId},token.eq.${lineUserId}`)
      .maybeSingle();
    
    if (clientErr || !client) {
      showError('会員情報が見つかりません。');
      hideLoading();
      return;
    }
    
    clientId = client.id;
    clientName = client.name;
    
    const today = new Date().toISOString().split('T')[0];
    const { data: log } = await supabase
      .from('daily_logs')
      .select('*')
      .eq('client_id', clientId)
      .eq('date', today)
      .maybeSingle();
    
    todayLog = log;
    
    if (!log || !log.started_at) {
      showWarning('まだ着手の記録がありません。\n「📷 着いた」ボタンを押してから帰る記録をしてください。');
      finishBtn.textContent = '🏁 終了として記録（着手なし）';
      finishBtn.disabled = false;
    } else if (log.status === 'completed' || log.completed_at) {
      showWarning('今日のセッションは既に記録済みです ✨');
      finishBtn.disabled = true;
      finishBtn.textContent = '✓ 記録済み';
      finishBtn.style.opacity = '0.4';
      
      confirmStats.style.display = 'block';
      document.getElementById('confirm-start-time').textContent = log.started_at;
      const startMin = parseTimeToMinutes(log.started_at);
      const endMin = parseTimeToMinutes(log.completed_at);
      const dur = Math.max(0, endMin - startMin);
      document.getElementById('confirm-duration').textContent = `${dur}分`;
      confirmSubtitle.textContent = '今日のセッション';
    } else {
      confirmStats.style.display = 'block';
      document.getElementById('confirm-start-time').textContent = log.started_at;
      finishBtn.disabled = false;
      updateElapsed();
      setInterval(updateElapsed, 30000);
    }
    
    hideLoading();
  } catch (e) {
    console.error(e);
    showError('LINE連携エラー: ' + (e.message || ''));
    hideLoading();
  }
});

function updateElapsed() {
  if (!todayLog || !todayLog.started_at) return;
  const startMin = parseTimeToMinutes(todayLog.started_at);
  const now = new Date();
  const nowMin = now.getHours() * 60 + now.getMinutes();
  const elapsed = Math.max(0, nowMin - startMin);
  document.getElementById('confirm-duration').textContent = `${elapsed}分`;
}

function parseTimeToMinutes(timeStr) {
  if (!timeStr) return 0;
  const [h, m] = timeStr.split(':').map(Number);
  return h * 60 + m;
}

function showError(msg) {
  errorMessage.textContent = msg;
  errorMessage.classList.add('show');
}
function showWarning(msg) {
  warningMessage.textContent = msg;
  warningMessage.classList.add('show');
}

finishBtn.addEventListener('click', async () => {
  showLoading('記録中...');
  
  try {
    const today = new Date().toISOString().split('T')[0];
    const now = new Date();
    const nowTimeStr = now.toLocaleTimeString('ja-JP', { hour: '2-digit', minute: '2-digit', hour12: false });
    
    if (todayLog) {
      const { error } = await supabase
        .from('daily_logs')
        .update({
          status: 'completed',
          completed_at: nowTimeStr,
          updated_at: new Date().toISOString()
        })
        .eq('id', todayLog.id);
      if (error) throw error;
    } else {
      const { data: newLog, error } = await supabase
        .from('daily_logs')
        .insert({
          client_id: clientId,
          date: today,
          status: 'completed',
          completed_at: nowTimeStr,
          task: 'ジムに行く'
        })
        .select()
        .single();
      if (error) throw error;
      todayLog = newLog;
    }
    
    const { error: evtErr } = await supabase
      .from('events')
      .insert({
        client_id: clientId,
        date: today,
        type: 'user_completed',
        message: `${clientName}さんがセッション完了 🏁`,
        is_new: true
      });
    if (evtErr) throw evtErr;
    
    hideLoading();
    showDone(nowTimeStr);
  } catch (e) {
    hideLoading();
    console.error(e);
    alert('送信に失敗しました: ' + e.message);
  }
});

async function showDone(endTimeStr) {
  confirmScreen.classList.add('hidden');
  doneScreen.classList.remove('hidden');
  
  document.getElementById('done-name').textContent = `${clientName}さん、お疲れ様！`;
  
  let durationMin = 0;
  let startTimeStr = '--:--';
  
  if (todayLog && todayLog.started_at) {
    startTimeStr = todayLog.started_at;
    const startMin = parseTimeToMinutes(todayLog.started_at);
    const endMin = parseTimeToMinutes(endTimeStr);
    durationMin = Math.max(0, endMin - startMin);
  }
  
  document.getElementById('session-duration-value').textContent = durationMin || '0';
  document.getElementById('session-time-range').textContent = `${startTimeStr} → ${endTimeStr}`;
  
  try {
    const stats = await calculateStreak();
    document.getElementById('streak-value').textContent = `${stats.streak}日 🔥`;
    document.getElementById('week-value').textContent = `${stats.weekDone}/${stats.weekTotal}`;
  } catch (e) {
    console.error('streak calc failed', e);
  }
}

async function calculateStreak() {
  const today = new Date();
  const todayStr = today.toISOString().split('T')[0];
  const thirtyDaysAgo = new Date(today);
  thirtyDaysAgo.setDate(thirtyDaysAgo.getDate() - 30);
  const thirtyDaysAgoStr = thirtyDaysAgo.toISOString().split('T')[0];
  
  const { data: logs } = await supabase
    .from('daily_logs')
    .select('date, status')
    .eq('client_id', clientId)
    .gte('date', thirtyDaysAgoStr)
    .lte('date', todayStr)
    .order('date', { ascending: false });
  
  let streak = 0;
  if (logs && logs.length > 0) {
    const cursor = new Date(today);
    for (let i = 0; i < 30; i++) {
      const cursorStr = cursor.toISOString().split('T')[0];
      const log = logs.find(l => l.date === cursorStr);
      if (log && (log.status === 'in_progress' || log.status === 'completed')) {
        streak++;
      } else {
        break;
      }
      cursor.setDate(cursor.getDate() - 1);
    }
  }
  
  const dayOfWeek = today.getDay();
  const daysSinceMonday = dayOfWeek === 0 ? 6 : dayOfWeek - 1;
  const monday = new Date(today);
  monday.setDate(monday.getDate() - daysSinceMonday);
  const mondayStr = monday.toISOString().split('T')[0];
  
  const weekDone = logs ? logs.filter(l => 
    l.date >= mondayStr && l.date <= todayStr && 
    (l.status === 'in_progress' || l.status === 'completed')
  ).length : 0;
  
  const weekTotal = daysSinceMonday + 1;
  
  return { streak, weekDone, weekTotal };
}

function showLoading(text) {
  loadingText.textContent = text || '送信中...';
  loading.classList.add('show');
}
function hideLoading() {
  loading.classList.remove('show');
}
</script>
</body>
</html>
