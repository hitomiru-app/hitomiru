<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>ヒトミル - レポート</title>
  <script src="https://static.line-scdn.net/liff/edge/versions/2.22.3/sdk.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg:      #1C1C1E;
      --bg2:     #2C2C2E;
      --bg3:     #3A3A3C;
      --yellow:  #FFC107;
      --yellow2: #FFD54F;
      --green:   #34C759;
      --text:    #FFFFFF;
      --text2:   rgba(235,235,245,0.6);
      --text3:   rgba(235,235,245,0.35);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    html, body { background: var(--bg); color: var(--text); font-family: 'Plus Jakarta Sans','Noto Sans JP',sans-serif; min-height: 100dvh; }

    /* ── LOADING ── */
    #loading-screen {
      position: fixed; inset: 0; background: var(--bg);
      display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 20px; z-index: 100;
      transition: opacity .4s;
    }
    #loading-screen.hidden { opacity: 0; pointer-events: none; }
    .logo-sub  { font-size: 10px; letter-spacing: 3px; text-transform: uppercase; color: var(--text3); font-weight: 700; margin-bottom: 8px; text-align: center; }
    .logo-text {
      font-size: 30px; font-weight: 800; letter-spacing: 2px;
      background: linear-gradient(90deg, var(--yellow), var(--yellow2));
      -webkit-background-clip: text; -webkit-text-fill-color: transparent;
    }
    .load-bar-wrap { width: 100px; height: 2px; background: var(--bg3); border-radius: 99px; overflow: hidden; }
    .load-bar {
      height: 100%; background: linear-gradient(90deg, var(--yellow), var(--yellow2));
      animation: barSlide 1.4s ease-in-out infinite;
    }
    @keyframes barSlide { 0%{transform:translateX(-100%)} 50%{transform:translateX(0)} 100%{transform:translateX(100%)} }
    .load-status { font-size: 11px; letter-spacing: 1.5px; text-transform: uppercase; color: var(--text3); font-weight: 600; }

    /* ── ERROR ── */
    #error-screen {
      display: none; position: fixed; inset: 0; background: var(--bg);
      flex-direction: column; align-items: center; justify-content: center;
      gap: 14px; padding: 40px; text-align: center;
    }
    #error-screen.visible { display: flex; }

    /* ── MAIN ── */
    #main { display: none; flex-direction: column; min-height: 100dvh; opacity: 0; transform: translateY(10px); transition: opacity .4s, transform .4s; padding-bottom: 48px; }
    #main.visible { display: flex; }
    #main.shown   { opacity: 1; transform: none; }

    /* ── HEADER ── */
    .header { padding: 52px 22px 24px; display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid var(--bg3); }
    .header-left .eyebrow { font-size: 10px; letter-spacing: 2.5px; text-transform: uppercase; color: var(--text3); font-weight: 700; margin-bottom: 4px; }
    .header-left .h-logo {
      font-size: 22px; font-weight: 800; letter-spacing: 1.5px;
      background: linear-gradient(90deg, var(--yellow), var(--yellow2));
      -webkit-background-clip: text; -webkit-text-fill-color: transparent;
    }
    .header-name { font-size: 12px; color: var(--text2); font-weight: 600; }

    /* ── SECTION ── */
    .section { padding: 28px 22px 0; }
    .sec-label {
      font-size: 10px; letter-spacing: 2.5px; text-transform: uppercase; color: var(--yellow); font-weight: 700; margin-bottom: 16px;
      display: flex; align-items: center; gap: 10px;
    }
    .sec-label::after { content: ''; flex: 1; height: 1px; background: linear-gradient(90deg, var(--bg3), transparent); }

    /* ── WEEK PILLS ── */
    .week-row { display: flex; gap: 6px; }
    .day-pill {
      flex: 1; display: flex; flex-direction: column; align-items: center; gap: 8px;
      padding: 12px 4px; background: var(--bg2); border: 1px solid var(--bg3); border-radius: 12px;
      transition: all .2s;
    }
    .day-pill.done   { border-color: rgba(255,193,7,.5); background: rgba(255,193,7,.08); }
    .day-pill.today  { border-color: rgba(255,193,7,.25); }
    .day-pill.future { opacity: .3; }
    .day-label { font-size: 9px; letter-spacing: 1px; text-transform: uppercase; color: var(--text3); font-weight: 700; }
    .day-mark  { font-size: 15px; line-height: 1; }
    .day-pill.done  .day-mark { color: var(--yellow); }
    .day-pill.today .day-mark { color: var(--text3); }
    .day-pill.past  .day-mark { color: var(--bg3); }

    .progress-wrap { margin-top: 14px; height: 3px; background: var(--bg3); border-radius: 99px; overflow: hidden; }
    .progress-bar  {
      height: 100%; background: linear-gradient(90deg, var(--yellow), var(--yellow2));
      border-radius: 99px; transition: width .8s cubic-bezier(.34,1.56,.64,1);
    }
    .progress-meta { margin-top: 10px; display: flex; justify-content: space-between; }
    .progress-count { font-size: 13px; font-weight: 700; }
    .progress-count span { color: var(--yellow2); }
    .progress-pct { font-size: 12px; color: var(--text3); font-weight: 600; }

    /* ── RECORDS ── */
    .records-grid { display: grid; grid-template-columns: repeat(3,1fr); gap: 10px; }
    .record-card {
      background: var(--bg2); border: 1px solid var(--bg3); border-radius: 14px;
      padding: 16px 10px; display: flex; flex-direction: column; align-items: center; gap: 6px;
      position: relative; overflow: hidden;
    }
    .record-card::before {
      content: ''; position: absolute; top: 0; left: 0; right: 0; height: 2px;
      background: linear-gradient(90deg, transparent, var(--yellow), transparent); opacity: .5;
    }
    .record-icon  { font-size: 20px; line-height: 1; }
    .record-value {
      font-size: 30px; font-weight: 800; line-height: 1;
      background: linear-gradient(135deg, var(--yellow), var(--yellow2));
      -webkit-background-clip: text; -webkit-text-fill-color: transparent;
    }
    .record-unit  { font-size: 9px; letter-spacing: 1px; text-transform: uppercase; color: var(--text3); font-weight: 700; margin-top: -2px; }
    .record-label { font-size: 10px; color: var(--text2); font-weight: 600; text-align: center; line-height: 1.3; }

    /* ── SESSIONS ── */
    .session-list {
      border: 1px solid var(--bg3); border-radius: 16px; overflow: hidden;
    }
    .session-card {
      display: flex; align-items: center; gap: 14px;
      padding: 15px 18px; border-bottom: 1px solid var(--bg3);
      background: var(--bg2);
      opacity: 0; transform: translateY(6px);
      transition: opacity .3s, transform .3s;
    }
    .session-card:last-child { border-bottom: none; }
    .session-card.shown { opacity: 1; transform: none; }

    .s-date     { min-width: 34px; text-align: center; }
    .s-date-num { font-size: 24px; font-weight: 800; line-height: 1; color: var(--yellow2); }
    .s-date-dow { font-size: 9px; letter-spacing: 1px; text-transform: uppercase; color: var(--text3); font-weight: 700; }
    .s-div      { width: 1px; height: 30px; background: var(--bg3); }
    .s-info     { flex: 1; }
    .s-duration { font-size: 14px; font-weight: 700; }
    .s-range    { font-size: 11px; color: var(--text3); margin-top: 2px; font-weight: 500; }
    .s-badge    {
      padding: 4px 10px; border-radius: 99px;
      font-size: 11px; font-weight: 700;
      background: rgba(52,199,89,.1); color: var(--green);
    }

    .empty-state { padding: 48px 20px; text-align: center; color: var(--text3); font-size: 13px; line-height: 1.8; }
    .empty-icon  { font-size: 36px; margin-bottom: 12px; }
  </style>
</head>
<body>

<!-- Loading -->
<div id="loading-screen">
  <div>
    <div class="logo-sub">My Report</div>
    <div class="logo-text">hitomiru</div>
  </div>
  <div class="load-bar-wrap"><div class="load-bar"></div></div>
  <div class="load-status" id="load-status">読み込み中</div>
</div>

<!-- Error -->
<div id="error-screen">
  <div style="font-size:36px">⚠️</div>
  <div style="font-size:16px;font-weight:800">データを取得できませんでした</div>
  <div style="font-size:13px;color:var(--text2);line-height:1.7" id="error-msg">しばらくして再度お試しください</div>
</div>

<!-- Main -->
<div id="main">

  <div class="header">
    <div class="header-left">
      <div class="eyebrow">My Report</div>
      <div class="h-logo">hitomiru</div>
    </div>
    <div class="header-name" id="client-name"></div>
  </div>

  <!-- This Week -->
  <div class="section">
    <div class="sec-label">This Week</div>
    <div class="week-row" id="week-row"></div>
    <div class="progress-wrap">
      <div class="progress-bar" id="progress-bar" style="width:0%"></div>
    </div>
    <div class="progress-meta">
      <div class="progress-count"><span id="week-done">0</span> / <span id="week-target">0</span> 回達成</div>
      <div class="progress-pct" id="week-pct">0%</div>
    </div>
  </div>

  <!-- Records -->
  <div class="section">
    <div class="sec-label">Records</div>
    <div class="records-grid">
      <div class="record-card">
        <div class="record-icon">🔥</div>
        <div class="record-value" id="rec-streak">0</div>
        <div class="record-unit">weeks</div>
        <div class="record-label">連続達成週</div>
      </div>
      <div class="record-card">
        <div class="record-icon">🏆</div>
        <div class="record-value" id="rec-month">0</div>
        <div class="record-unit">回</div>
        <div class="record-label">今月達成数</div>
      </div>
      <div class="record-card">
        <div class="record-icon">⏱</div>
        <div class="record-value" id="rec-hours">0</div>
        <div class="record-unit">h</div>
        <div class="record-label">累計滞在</div>
      </div>
    </div>
  </div>

  <!-- Recent Sessions -->
  <div class="section">
    <div class="sec-label">Recent Sessions</div>
    <div class="session-list" id="session-list"></div>
  </div>

</div>

<script>
// ═══ CONFIG ═══════════════════════════════
const LIFF_ID      = '2009941074-uSKRFkFW';
const SUPABASE_URL = 'https://qqgawirefsxcgrsdskpq.supabase.co';
const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InFxZ2F3aXJlZnN4Y2dyc2Rza3BxIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzQ4MTMxNTksImV4cCI6MjA5MDM4OTE1OX0.XkbN4z-0gDfkuPwiydw7crgnN2XpUSWtIGC6xD9xc5U';
const TEST_USER_ID = 'U7992c20d68b6de12b011f21d2b2107a5';
const DOW = ['日','月','火','水','木','金','土'];

const $ = id => document.getElementById(id);
function setStatus(t) { $('load-status').textContent = t; }
function showError(t) {
  $('loading-screen').classList.add('hidden');
  $('error-msg').textContent = t;
  $('error-screen').classList.add('visible');
}
async function sbGet(path) {
  const r = await fetch(SUPABASE_URL + path, {
    headers: { apikey: SUPABASE_KEY, Authorization: 'Bearer ' + SUPABASE_KEY }
  });
  if (!r.ok) throw new Error(`HTTP ${r.status}: ${await r.text()}`);
  return r.json();
}
function toDateStr(d) {
  return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
}
function addDays(date, days) {
  const d = new Date(date);
  d.setDate(d.getDate() + days);
  return d;
}
function todayStr() { return toDateStr(new Date()); }
function weekMonday() {
  const d = new Date(), day = d.getDay();
  d.setDate(d.getDate()-(day===0?6:day-1)); d.setHours(0,0,0,0); return d;
}
function weekMondayOf(dateStr) {
  const d = new Date(dateStr + 'T00:00:00');
  const day = d.getDay();
  d.setDate(d.getDate() - (day === 0 ? 6 : day - 1));
  d.setHours(0,0,0,0);
  return d;
}
function monthStart() {
  const d = new Date(); d.setDate(1); d.setHours(0,0,0,0); return toDateStr(d);
}
function parseTimeToMinutes(value) {
  if (!value) return null;
  const text = String(value);
  const hm = text.match(/^(\d{1,2}):(\d{2})/);
  if (hm) return Number(hm[1]) * 60 + Number(hm[2]);
  const d = new Date(text);
  if (!Number.isNaN(d.getTime())) return d.getHours() * 60 + d.getMinutes();
  return null;
}
function durationMin(log) {
  if (!log.started_at || !log.completed_at) return null;
  const start = parseTimeToMinutes(log.started_at);
  const end = parseTimeToMinutes(log.completed_at);
  if (start === null || end === null) return null;
  let diff = end - start;
  if (diff < 0) diff += 24 * 60;
  return diff;
}
function fmtTime(value) {
  const min = parseTimeToMinutes(value);
  if (min === null) return '—';
  return String(Math.floor(min / 60)).padStart(2,'0')+':'+String(min % 60).padStart(2,'0');
}

// streak: completed が連続している日数（今日未完了でも昨日以前が継続なら維持）
function isSuccessStatus(status) {
  return status === 'in_progress' || status === 'completed';
}
function isPlannedStatus(status) {
  return ['scheduled','in_progress','completed','missed','rescheduled'].includes(status);
}
function calcWeeklyStreak(goals, logs) {
  const successByWeek = {};
  const plannedByWeek = {};
  logs.forEach(log => {
    const week = toDateStr(weekMondayOf(log.date));
    if (!plannedByWeek[week]) plannedByWeek[week] = 0;
    if (!successByWeek[week]) successByWeek[week] = 0;
    if (isPlannedStatus(log.status)) plannedByWeek[week]++;
    if (isSuccessStatus(log.status)) successByWeek[week]++;
  });

  const goalMap = {};
  (goals || []).forEach(goal => {
    goalMap[goal.week_start_date] = Number(goal.target_count || 0);
  });

  let streak = 0;
  let cursor = weekMonday();
  for (let i = 0; i < 52; i++) {
    const week = toDateStr(cursor);
    const target = goalMap[week] || plannedByWeek[week] || 0;
    const done = successByWeek[week] || 0;
    if (target <= 0) break;
    if (done >= target) streak++;
    else break;
    cursor = addDays(cursor, -7);
  }
  return streak;
}

// ─── RENDER ───────────────────────────────
function renderWeek(logs, goal) {
  const logMap = {};
  logs.forEach(l => logMap[l.date] = l);
  const mon   = weekMonday(), today = todayStr();
  const LABELS = ['月','火','水','木','金','土','日'];
  const row = $('week-row'); row.innerHTML = '';
  let done = 0;
  const plannedCount = logs.filter(l => isPlannedStatus(l.status)).length;
  const target = Math.max(Number(goal?.target_count || 0), plannedCount, 1);

  for (let i = 0; i < 7; i++) {
    const d = new Date(mon); d.setDate(mon.getDate()+i);
    const ds = toDateStr(d);
    const log = logMap[ds];
    const isDone   = isSuccessStatus(log?.status);
    const isPlanned = log && isPlannedStatus(log.status);
    const isMissed = log?.status === 'missed' || log?.status === 'failed';
    const isToday  = ds === today;
    const isFuture = ds > today;
    if (isDone) done++;

    const cls  = isDone ? 'done' : isToday ? 'today' : isFuture ? 'future' : 'past';
    const mark = isDone ? '✓' : isMissed ? '×' : isPlanned ? '予' : '·';
    const el = document.createElement('div');
    el.className = 'day-pill ' + cls;
    el.innerHTML = `<div class="day-label">${LABELS[i]}</div><div class="day-mark">${mark}</div>`;
    row.appendChild(el);
  }

  const pct = Math.min(100, Math.round(done/target*100));
  $('week-done').textContent = done;
  $('week-target').textContent = target;
  $('week-pct').textContent  = pct + '%';
  setTimeout(() => { $('progress-bar').style.width = pct + '%'; }, 80);
}

function renderRecords(allLogs, monthLogs, goals) {
  $('rec-streak').textContent = calcWeeklyStreak(goals, allLogs);

  // 今月完了数
  $('rec-month').textContent = monthLogs.filter(l => isSuccessStatus(l.status)).length;

  // 累計滞在時間（completed & started_at & completed_at があるもの）
  const totalMin = allLogs.reduce((sum, l) => sum + (durationMin(l) || 0), 0);
  $('rec-hours').textContent = (totalMin / 60).toFixed(1);
}

function renderSessions(allLogs) {
  const sessions = allLogs
    .filter(l => l.status === 'completed' && l.started_at && l.completed_at)
    .sort((a,b) => b.date.localeCompare(a.date))
    .slice(0, 10);

  const list = $('session-list');
  list.innerHTML = '';

  if (!sessions.length) {
    list.innerHTML = `<div class="empty-state"><div class="empty-icon">💪</div>まだセッションの記録がありません。<br>ジムに行ったら記録が残ります。</div>`;
    return;
  }

  sessions.forEach((log, i) => {
    const d   = new Date(log.date+'T00:00:00');
    const min = durationMin(log);
    const card = document.createElement('div');
    card.className = 'session-card';
    card.innerHTML = `
      <div class="s-date">
        <div class="s-date-num">${d.getDate()}</div>
        <div class="s-date-dow">${DOW[d.getDay()]}</div>
      </div>
      <div class="s-div"></div>
      <div class="s-info">
        <div class="s-duration">${min != null ? min + ' 分' : '—'}</div>
        <div class="s-range">${fmtTime(log.started_at)} → ${fmtTime(log.completed_at)}</div>
      </div>
      <div class="s-badge">✓ 完了</div>
    `;
    list.appendChild(card);
    setTimeout(() => card.classList.add('shown'), 60 + i * 40);
  });
}

// ─── MAIN ─────────────────────────────────
async function main() {
  setStatus('起動中...');

  // LIFF（失敗してもフォールバック）
  let lineUserId = null;
  try {
    await Promise.race([
      liff.init({ liffId: LIFF_ID }),
      new Promise((_,rej) => setTimeout(rej, 5000))
    ]);
    if (liff.isLoggedIn()) lineUserId = (await liff.getProfile()).userId;
  } catch(_) {}
  if (!lineUserId) lineUserId = TEST_USER_ID;

  // Client
  setStatus('データ取得中...');
  let clientId = null;
  try {
    const safeUserId = encodeURIComponent(lineUserId);
    const clients = await sbGet(`/rest/v1/clients?or=(token.eq.${safeUserId},line_user_id.eq.${safeUserId})&select=id,name&limit=1`);
    if (!clients.length) throw new Error('このアカウントは登録されていません');
    clientId = clients[0].id;
    $('client-name').textContent = clients[0].name;
  } catch(e) { showError(e.message); return; }

  // Data（3本まとめて取得）
  try {
    const monDs  = toDateStr(weekMonday());
    const sunDs  = toDateStr(addDays(weekMonday(), 6));
    const monDs2 = monthStart();

    const [weekLogs, monthLogs, allLogs, currentGoals, allGoals] = await Promise.all([
      // 今週（completed判定用）
      sbGet(`/rest/v1/daily_logs?client_id=eq.${clientId}&date=gte.${monDs}&date=lte.${sunDs}&select=date,status&order=date.desc`),
      // 今月（今月達成数）
      sbGet(`/rest/v1/daily_logs?client_id=eq.${clientId}&date=gte.${monDs2}&select=date,status&order=date.desc`),
      // 全期間（streak・累計・セッション履歴）— started_at/completed_at も必要
      sbGet(`/rest/v1/daily_logs?client_id=eq.${clientId}&select=date,status,started_at,completed_at&order=date.desc&limit=500`),
      // 今週の目標回数
      sbGet(`/rest/v1/weekly_goals?client_id=eq.${clientId}&week_start_date=eq.${monDs}&select=*&limit=1`),
      // 連続達成週の計算用
      sbGet(`/rest/v1/weekly_goals?client_id=eq.${clientId}&select=*&order=week_start_date.desc&limit=100`),
    ]);
    const currentGoal = currentGoals[0] || null;

    renderWeek(weekLogs, currentGoal);
    renderRecords(allLogs, monthLogs, allGoals);
    renderSessions(allLogs);

  } catch(e) { showError('データ取得に失敗しました: ' + e.message); return; }

  $('loading-screen').classList.add('hidden');
  $('main').classList.add('visible');
  requestAnimationFrame(() => setTimeout(() => $('main').classList.add('shown'), 20));
}

window.addEventListener('load', main);
</script>
</body>
</html>
