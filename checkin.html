<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#FFC107">
<title>hitomiru</title>
<script charset="utf-8" src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&family=Noto+Sans+JP:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root {
  --yellow: #FFC107; --yellow-deep: #FFB300; --yellow-pale: #FFF8E1;
  --yellow-glow: #FFECB3; --dark: #1C1C1E; --dark2: #2C2C2E;
  --gray: #8E8E93; --gray-light: #F2F2F7; --white: #FFFFFF;
  --success: #30D158; --success-bg: #E8FAE8; --danger: #FF453A;
  --font: 'Plus Jakarta Sans', 'Noto Sans JP', -apple-system, sans-serif;
}
* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
html, body {
  width: 100%; height: 100vh; height: 100dvh; overflow: hidden;
  background: var(--dark); color: var(--white);
  font-family: var(--font); -webkit-font-smoothing: antialiased;
}
.screen { position: fixed; inset: 0; display: flex; flex-direction: column; }
.screen.hidden { display: none; }
.nav {
  padding: 16px 20px; padding-top: max(16px, env(safe-area-inset-top));
  display: flex; align-items: center; justify-content: space-between;
  background: var(--dark);
}
.nav-logo {
  font-size: 22px; font-weight: 800; letter-spacing: -0.03em;
  background: linear-gradient(135deg, var(--yellow), #FFD54F);
  -webkit-background-clip: text; -webkit-text-fill-color: transparent;
  background-clip: text;
}
.nav-pill {
  font-size: 10px; font-weight: 700; letter-spacing: 0.12em; text-transform: uppercase;
  color: var(--dark); background: var(--yellow);
  padding: 5px 12px; border-radius: 20px;
}
#start-screen {
  background: linear-gradient(180deg, var(--dark) 0%, #262626 100%);
  justify-content: space-between;
}
.hero {
  flex: 1; display: flex; flex-direction: column;
  justify-content: center; align-items: center;
  padding: 0 36px; text-align: center;
}
.hero-circle {
  width: 140px; height: 140px; border-radius: 50%;
  background: radial-gradient(circle at 30% 30%, var(--yellow-glow), var(--yellow));
  display: flex; align-items: center; justify-content: center;
  margin-bottom: 36px;
  box-shadow: 0 12px 40px rgba(255, 193, 7, 0.35), 0 0 80px rgba(255, 193, 7, 0.15);
  animation: pulse 2.5s ease-in-out infinite;
}
@keyframes pulse {
  0%, 100% { box-shadow: 0 12px 40px rgba(255,193,7,0.35), 0 0 80px rgba(255,193,7,0.15); }
  50% { box-shadow: 0 16px 60px rgba(255,193,7,0.5), 0 0 120px rgba(255,193,7,0.25); }
}
.hero-circle svg { width: 52px; height: 52px; color: var(--dark); }
.hero-title {
  font-size: 26px; font-weight: 800; letter-spacing: -0.02em;
  line-height: 1.35; margin-bottom: 14px;
}
.hero-title em {
  font-style: normal;
  background: linear-gradient(135deg, var(--yellow), #FFD54F);
  -webkit-background-clip: text; -webkit-text-fill-color: transparent;
  background-clip: text;
}
.hero-sub { font-size: 14px; color: var(--gray); line-height: 1.7; }
.bottom {
  padding: 16px 20px; padding-bottom: max(16px, env(safe-area-inset-bottom));
  background: var(--dark);
}
.btn-main {
  width: 100%; padding: 18px;
  background: linear-gradient(135deg, var(--yellow), var(--yellow-deep));
  color: var(--dark); border: none; border-radius: 16px;
  font-family: var(--font); font-size: 16px; font-weight: 700;
  letter-spacing: 0.02em; cursor: pointer;
  display: flex; align-items: center; justify-content: center; gap: 10px;
  box-shadow: 0 6px 24px rgba(255, 193, 7, 0.3);
  transition: transform 0.12s ease, box-shadow 0.12s ease;
}
.btn-main:active { transform: scale(0.97); box-shadow: 0 3px 12px rgba(255, 193, 7, 0.2); }
.btn-main:disabled { opacity: 0.3; cursor: not-allowed; transform: none; box-shadow: none; }
.btn-main svg { width: 20px; height: 20px; }
.debug-box {
  margin: 0 20px 12px; padding: 14px 16px;
  background: rgba(255, 69, 58, 0.12); border: 1px solid rgba(255, 69, 58, 0.3);
  border-radius: 12px; font-size: 13px; color: #FF6961;
  line-height: 1.5; display: none; word-break: break-all;
}
.debug-box.show { display: block; }
.debug-box.info { background: rgba(255,193,7,0.1); border-color: rgba(255,193,7,0.3); color: var(--yellow); }

#camera-screen {
  background: #050505;
  color: #fff;
}
.cam-wrap {
  flex: 1;
  position: relative;
  overflow: hidden;
  background: radial-gradient(circle at 50% 36%, rgba(255,193,7,0.12), transparent 34%), #050505;
}
#video { width: 100%; height: 100%; object-fit: cover; filter: saturate(0.96) contrast(1.04); }
.cam-wrap::after {
  content: '';
  position: absolute; inset: 0; pointer-events: none; z-index: 1;
  background:
    linear-gradient(180deg, rgba(0,0,0,0.55) 0%, transparent 22%, transparent 62%, rgba(0,0,0,0.58) 100%),
    radial-gradient(circle at center, transparent 45%, rgba(0,0,0,0.32) 100%);
}
.cam-bar {
  position: absolute; top: 0; left: 0; right: 0; z-index: 4;
  min-height: 92px;
  padding: max(22px, env(safe-area-inset-top)) 24px 30px;
  background: linear-gradient(180deg, rgba(0,0,0,0.82) 0%, rgba(0,0,0,0.36) 58%, transparent 100%);
  display: flex; align-items: flex-start; justify-content: space-between;
}
.cam-bar-logo {
  color: var(--yellow);
  font-size: 21px;
  font-weight: 950;
  letter-spacing: 0.03em;
  line-height: 1;
  text-shadow: 0 8px 26px rgba(255,193,7,0.42);
}
.cam-bar-logo::after {
  content: 'CHECK-IN';
  display: block;
  margin-top: 8px;
  color: rgba(255,255,255,0.72);
  font-size: 10px;
  font-weight: 800;
  letter-spacing: 0.28em;
}
.viewfinder {
  position: absolute; z-index: 3;
  left: 50%; top: 48%; transform: translate(-50%, -50%);
  width: min(74vw, 360px);
  aspect-ratio: 0.78;
  border: 2px solid rgba(255,255,255,0.82);
  border-radius: 28px;
  box-shadow:
    inset 0 0 0 1px rgba(255,255,255,0.10),
    0 22px 70px rgba(0,0,0,0.42);
  pointer-events: none;
}
.viewfinder::before, .viewfinder::after {
  content: ''; position: absolute; width: 42px; height: 42px;
  border-color: var(--yellow); border-style: solid;
}
.viewfinder::before { top: -3px; left: -3px; border-width: 6px 0 0 6px; border-radius: 28px 0 0 0; }
.viewfinder::after { right: -3px; bottom: -3px; border-width: 0 6px 6px 0; border-radius: 0 0 28px 0; }
.viewfinder-grid {
  position: absolute; inset: 0; border-radius: 26px; overflow: hidden; opacity: 0.34;
  background:
    linear-gradient(90deg, transparent 33%, rgba(255,255,255,0.32) 33%, rgba(255,255,255,0.32) 34%, transparent 34%, transparent 66%, rgba(255,255,255,0.32) 66%, rgba(255,255,255,0.32) 67%, transparent 67%),
    linear-gradient(0deg, transparent 33%, rgba(255,255,255,0.32) 33%, rgba(255,255,255,0.32) 34%, transparent 34%, transparent 66%, rgba(255,255,255,0.32) 66%, rgba(255,255,255,0.32) 67%, transparent 67%);
}
.cam-hint {
  position: absolute; bottom: 102px; left: 50%; z-index: 4;
  transform: translateX(-50%);
  color: #fff;
  font-size: 15px; font-weight: 900;
  letter-spacing: 0.03em;
  text-shadow: 0 3px 18px rgba(0,0,0,0.86);
  white-space: nowrap;
}
.cam-hint::before {
  content: ''; display: inline-block;
  width: 8px; height: 8px; border-radius: 50%;
  margin-right: 9px; vertical-align: 1px;
  background: var(--yellow);
  box-shadow: 0 0 18px rgba(255,193,7,0.75);
}
.cam-controls {
  padding: 26px 24px; padding-bottom: max(30px, env(safe-area-inset-bottom));
  background: linear-gradient(180deg, rgba(10,10,10,0.78), #050505 76%);
  display: flex; align-items: center; justify-content: center;
}
.shutter {
  width: 82px; height: 82px; border-radius: 50%;
  background: linear-gradient(145deg, #ffe49a 0%, var(--yellow) 52%, #bf8f00 100%);
  border: 9px solid rgba(255,255,255,0.16);
  cursor: pointer; position: relative; padding: 0;
  box-shadow:
    0 0 0 12px rgba(255,193,7,0.10),
    0 20px 46px rgba(255,193,7,0.34),
    inset 0 2px 9px rgba(255,255,255,0.42);
  transition: transform 0.1s ease, box-shadow 0.1s ease;
}
.shutter:active { transform: scale(0.92); box-shadow: 0 0 0 8px rgba(255,193,7,0.16), 0 10px 28px rgba(255,193,7,0.3); }
.shutter::after {
  content: ''; position: absolute; inset: 11px;
  border-radius: 50%; border: 2px solid rgba(26,26,26,0.32);
}

#preview-screen {
  background:
    radial-gradient(circle at 50% 18%, rgba(255,193,7,0.16), transparent 28%),
    #050505;
  color: #fff;
}
.preview-wrap {
  flex: 1;
  position: relative;
  display: flex;
  flex-direction: column;
  padding: max(22px, env(safe-area-inset-top)) 20px max(22px, env(safe-area-inset-bottom));
  gap: 18px;
}
.preview-head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  min-height: 44px;
}
.preview-logo {
  color: var(--yellow);
  font-size: 21px;
  font-weight: 950;
  letter-spacing: 0.03em;
}
.preview-kicker {
  color: rgba(255,255,255,0.62);
  font-size: 10px;
  font-weight: 800;
  letter-spacing: 0.24em;
}
.preview-copy {
  text-align: center;
  margin: 2px auto 0;
}
.preview-title {
  font-size: 23px;
  line-height: 1.35;
  font-weight: 900;
  letter-spacing: -0.02em;
}
.preview-sub {
  margin-top: 8px;
  color: rgba(255,255,255,0.58);
  font-size: 13px;
  line-height: 1.7;
}
.preview-frame {
  flex: 1;
  min-height: 0;
  position: relative;
  border-radius: 32px;
  overflow: hidden;
  border: 1px solid rgba(255,255,255,0.12);
  background: #111;
  box-shadow:
    0 22px 70px rgba(0,0,0,0.48),
    inset 0 0 0 1px rgba(255,255,255,0.08);
}
#preview-img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  display: block;
}
.preview-frame::after {
  content: '';
  position: absolute;
  inset: 0;
  pointer-events: none;
  background:
    linear-gradient(180deg, rgba(0,0,0,0.05), transparent 58%, rgba(0,0,0,0.22)),
    radial-gradient(circle at center, transparent 60%, rgba(0,0,0,0.18) 100%);
}
.preview-actions {
  display: grid;
  grid-template-columns: 1fr 1.4fr;
  gap: 12px;
}
.btn-secondary,
.btn-send {
  min-height: 58px;
  border: 0;
  border-radius: 18px;
  font-family: var(--font);
  font-size: 15px;
  font-weight: 900;
  letter-spacing: 0.02em;
  cursor: pointer;
  transition: transform .12s ease, box-shadow .12s ease, opacity .12s ease;
}
.btn-secondary {
  color: rgba(255,255,255,0.9);
  background: rgba(255,255,255,0.11);
  border: 1px solid rgba(255,255,255,0.14);
}
.btn-send {
  color: #151515;
  background: linear-gradient(145deg, #ffe49a 0%, var(--yellow) 55%, #c99700 100%);
  box-shadow: 0 14px 32px rgba(255,193,7,0.28);
}
.btn-secondary:active,
.btn-send:active {
  transform: scale(0.97);
}

#done-screen {
  background: var(--dark);
  justify-content: center; align-items: center; padding: 0 36px;
}
.done-wrap { text-align: center; width: 100%; max-width: 360px; }
.done-ring {
  width: 100px; height: 100px; border-radius: 50%;
  background: linear-gradient(135deg, var(--success), #4ADE80);
  margin: 0 auto 28px;
  display: flex; align-items: center; justify-content: center;
  box-shadow: 0 8px 32px rgba(48,209,88,0.3);
  animation: popIn 0.5s cubic-bezier(0.34, 1.56, 0.64, 1) backwards;
}
@keyframes popIn { 0% { transform: scale(0); opacity: 0; } 100% { transform: scale(1); opacity: 1; } }
.done-ring svg { width: 44px; height: 44px; color: var(--white); }
.done-title {
  font-size: 24px; font-weight: 800; letter-spacing: -0.02em; margin-bottom: 6px;
  animation: up 0.4s ease 0.2s backwards;
}
.done-time { font-size: 14px; color: var(--gray); margin-bottom: 32px; animation: up 0.4s ease 0.3s backwards; }
.streak-card {
  background: linear-gradient(135deg, rgba(255,193,7,0.12), rgba(255,193,7,0.04));
  border: 1px solid rgba(255,193,7,0.25);
  border-radius: 20px; padding: 24px; margin-bottom: 28px;
  animation: up 0.4s ease 0.4s backwards;
}
.streak-label { font-size: 10px; font-weight: 700; letter-spacing: 0.15em; color: var(--yellow); margin-bottom: 8px; }
.streak-num {
  font-size: 40px; font-weight: 800; letter-spacing: -0.03em;
  background: linear-gradient(135deg, var(--yellow), #FFD54F);
  -webkit-background-clip: text; -webkit-text-fill-color: transparent;
  background-clip: text; margin-bottom: 4px;
}
.streak-sub { font-size: 13px; color: var(--gray); }
.done-msg { font-size: 13px; color: #636366; line-height: 1.6; animation: up 0.4s ease 0.5s backwards; }
@keyframes up { 0% { transform: translateY(16px); opacity: 0; } 100% { transform: translateY(0); opacity: 1; } }

.loader {
  position: fixed; inset: 0;
  background: rgba(28,28,30,0.97); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
  display: none; flex-direction: column; align-items: center; justify-content: center; z-index: 100;
}
.loader.show { display: flex; }
.loader-spin {
  width: 36px; height: 36px;
  border: 3px solid rgba(255,193,7,0.15); border-top-color: var(--yellow);
  border-radius: 50%; animation: spin 0.7s linear infinite; margin-bottom: 14px;
}
@keyframes spin { to { transform: rotate(360deg); } }
.loader-text { font-size: 13px; color: var(--gray); }
</style>
</head>
<body>

<div class="screen" id="start-screen">
  <div class="nav">
    <div class="nav-logo">hitomiru</div>
    <div class="nav-pill">Check in</div>
  </div>
  <div class="hero">
    <div class="hero-circle">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/><circle cx="12" cy="13" r="4"/></svg>
    </div>
    <div class="hero-title" id="hero-title">ジム、<em>着きましたか？</em></div>
    <div class="hero-sub" id="hero-sub">入口の写真を1枚撮るだけ。<br>コーチがあなたを見ています。</div>
  </div>
  <div class="debug-box" id="debug"></div>
  <div class="bottom">
    <button class="btn-main" id="start-btn" disabled>
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/><circle cx="12" cy="13" r="4"/></svg>
      カメラを起動
    </button>
  </div>
</div>

<div class="screen hidden" id="camera-screen">
  <div class="cam-wrap">
    <video id="video" autoplay playsinline muted></video>
    <div class="cam-bar"><div class="cam-bar-logo">Hitomiru</div></div>
    <div class="viewfinder"><div class="viewfinder-grid"></div></div>
    <div class="cam-hint">ジム外観を撮影</div>
  </div>
  <div class="cam-controls">
    <button class="shutter" id="shutter-btn"></button>
  </div>
</div>

<div class="screen hidden" id="preview-screen">
  <div class="preview-wrap">
    <div class="preview-head">
      <div class="preview-logo">Hitomiru</div>
      <div class="preview-kicker">CHECK PHOTO</div>
    </div>
    <div class="preview-copy">
      <div class="preview-title">この写真で<br>チェックインしますか？</div>
      <div class="preview-sub">ジム外観が写っていればOKです。<br>違う写真なら撮り直せます。</div>
    </div>
    <div class="preview-frame"><img id="preview-img" alt="撮影したジム外観"></div>
    <div class="preview-actions">
      <button class="btn-secondary" id="retake-btn">再撮影</button>
      <button class="btn-send" id="send-btn">送信する</button>
    </div>
  </div>
</div>

<div class="screen hidden" id="done-screen">
  <div class="done-wrap">
    <div class="done-ring">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>
    </div>
    <div class="done-title" id="done-name">チェックイン完了</div>
    <div class="done-time" id="done-time"></div>
    <div class="streak-card">
      <div class="streak-label">連続達成週</div>
      <div class="streak-num" id="streak-value">-</div>
      <div class="streak-sub" id="streak-week">-</div>
    </div>
    <div class="done-msg">コーチに通知しました。<br>まもなくLINEにメッセージが届きます。</div>
  </div>
</div>

<div class="loader" id="loading"><div class="loader-spin"></div><div class="loader-text" id="load-text">接続中...</div></div>
<input id="photo-input" type="file" accept="image/*" capture="environment" style="display:none;">
<canvas id="canvas" style="display:none;"></canvas>

<script>
const LIFF_ID = '2009941074-yUtzQuMe';
const SUPABASE_URL = 'https://qqgawirefsxcgrsdskpq.supabase.co';
const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InFxZ2F3aXJlZnN4Y2dyc2Rza3BxIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzQ4MTMxNTksImV4cCI6MjA5MDM4OTE1OX0.XkbN4z-0gDfkuPwiydw7crgnN2XpUSWtIGC6xD9xc5U';
const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
const $ = id => document.getElementById(id);
let stream = null, cid = null, cname = '', ctime = '', lineUserId = '';
let pendingBlob = null;
let previewUrl = null;

function dbg(msg, isErr) {
  const el = $('debug');
  el.textContent = msg;
  el.className = 'debug-box show' + (isErr ? '' : ' info');
}

window.addEventListener('load', async () => {
  showL('LINEと接続中...');
  try {
    await liff.init({ liffId: LIFF_ID });
    if (!liff.isLoggedIn()) { liff.login(); return; }

    const p = await liff.getProfile();
    lineUserId = p.userId;

    const { data: c, error: e } = await sb.from('clients').select('*')
      .or(`line_user_id.eq.${p.userId},token.eq.${p.userId}`).maybeSingle();

    if (e) { dbg('Supabaseエラー: ' + JSON.stringify(e), true); hideL(); return; }
    if (!c) {
      showUnavailable('モニター登録者のみ利用できます', 'ヒトミルは現在、モニター登録者のみ利用できます。\\nモニター希望の方はLINEで「モニター」と送ってください。');
      hideL();
      return;
    }

    const status = c.status || 'monitor';
    const today = toDateStr(new Date());
    const ended = c.plan_end_date && today > c.plan_end_date && status === 'monitor';
    if (['lead', 'expired', 'cancelled'].includes(status) || ended) {
      showUnavailable('モニター期間が終了しています', '継続する場合は、通常プランで引き続きご利用いただけます。\\n継続希望の方はLINEで「継続」と送ってください。');
      hideL();
      return;
    }

    cid = c.id; cname = c.name;
    $('start-btn').disabled = false;
    hideL();
  } catch (err) {
    dbg('エラー: ' + (err.message || JSON.stringify(err)), true);
    hideL();
  }
});

$('start-btn').addEventListener('click', async () => {
  try {
    showL('カメラを起動中...');
    stream = await navigator.mediaDevices.getUserMedia({
      video: { facingMode: { ideal: 'environment' } },
      audio: false
    });
    $('video').srcObject = stream;
    $('start-screen').classList.add('hidden');
    $('camera-screen').classList.remove('hidden');
    hideL();
  } catch (err) {
    hideL();
    // LIFFや端末設定でWebカメラが使えない場合だけ、標準カメラにフォールバックします。
    $('photo-input').click();
  }
});

$('photo-input').addEventListener('change', async (event) => {
  const file = event.target.files && event.target.files[0];
  if (!file) return;
  try {
    showPreview(file);
  } catch (e) {
    hideL();
    dbg('プレビュー表示に失敗: ' + (e.message || e), true);
  } finally {
    event.target.value = '';
  }
});

$('shutter-btn').addEventListener('click', async () => {
  const ctx = $('canvas').getContext('2d');
  $('canvas').width = $('video').videoWidth;
  $('canvas').height = $('video').videoHeight;
  ctx.drawImage($('video'), 0, 0);
  if (stream) { stream.getTracks().forEach(t => t.stop()); stream = null; }
  $('canvas').toBlob(async blob => {
    try { showPreview(blob); }
    catch (e) { alert('撮影失敗: ' + e.message); $('camera-screen').classList.add('hidden'); $('start-screen').classList.remove('hidden'); }
  }, 'image/jpeg', 0.85);
});

$('retake-btn').addEventListener('click', async () => {
  clearPreview();
  $('preview-screen').classList.add('hidden');
  try {
    showL('カメラを起動中...');
    stream = await navigator.mediaDevices.getUserMedia({
      video: { facingMode: { ideal: 'environment' } },
      audio: false
    });
    $('video').srcObject = stream;
    $('camera-screen').classList.remove('hidden');
    hideL();
  } catch (err) {
    hideL();
    $('photo-input').click();
  }
});

$('send-btn').addEventListener('click', async () => {
  if (!pendingBlob) return;
  try {
    $('send-btn').disabled = true;
    $('retake-btn').disabled = true;
    showL('送信中...');
    await send(pendingBlob);
    hideL();
    clearPreview();
    await doneUI();
  } catch (e) {
    hideL();
    $('send-btn').disabled = false;
    $('retake-btn').disabled = false;
    alert('送信失敗: ' + (e.message || e));
  }
});

function showPreview(blob) {
  pendingBlob = blob;
  if (previewUrl) URL.revokeObjectURL(previewUrl);
  previewUrl = URL.createObjectURL(blob);
  $('preview-img').src = previewUrl;
  $('start-screen').classList.add('hidden');
  $('camera-screen').classList.add('hidden');
  $('done-screen').classList.add('hidden');
  $('preview-screen').classList.remove('hidden');
  $('send-btn').disabled = false;
  $('retake-btn').disabled = false;
}

function clearPreview() {
  pendingBlob = null;
  if (previewUrl) {
    URL.revokeObjectURL(previewUrl);
    previewUrl = null;
  }
  $('preview-img').removeAttribute('src');
}

async function send(blob) {
  const today = toDateStr(new Date());
  ctime = new Date().toLocaleTimeString('ja-JP', { hour: '2-digit', minute: '2-digit', hour12: false });
  const fn = `${cid}/${today}_${Date.now()}.jpg`;
  const { error: ue } = await sb.storage.from('checkins').upload(fn, blob, { contentType: blob.type || 'image/jpeg' });
  let url = null;
  if (!ue) { const { data } = sb.storage.from('checkins').getPublicUrl(fn); url = data.publicUrl; }
  const { data: existingRows } = await sb.from('daily_logs').select('id').eq('client_id', cid).eq('date', today).order('id', { ascending: false }).limit(1);
  const ex = existingRows && existingRows[0];
  if (ex) {
    const { error } = await sb.from('daily_logs').update({ status: 'in_progress', started_at: ctime }).eq('id', ex.id);
    if (error) throw error;
  } else {
    const { error } = await sb.from('daily_logs').insert({ client_id: cid, date: today, status: 'in_progress', started_at: ctime, task: 'ジムに行く' });
    if (error) throw error;
  }
  const msg = url ? `${cname}さんがジム到着 📷\n${url}` : `${cname}さんがジム到着`;
  const { error: eventError } = await sb.from('events').insert({ client_id: cid, date: today, type: 'user_started', message: msg, is_new: true });
  if (eventError) throw eventError;

  // ★ LINE公式アカウントからプッシュメッセージ送信（Edge Function経由）
  try {
    const stats = await calcStreak();
    await sb.functions.invoke('send-line-message', {
      body: {
        lineUserId: lineUserId,
        message: `✅ ${cname}さん、チェックイン完了\n\n開始時刻：${ctime}\n今週の達成：${stats.wd}/${stats.wt}回\n連続達成週：${stats.streak}週🔥\n\n今日もジムに来れました。\nまずは「来た」だけで勝ちです。\n\nコーチが確認次第、メッセージをお送りします💪`
      }
    });
  } catch (lineErr) {
    console.log('LINE送信エラー（無視可）:', lineErr);
  }
}

async function doneUI() {
  $('start-screen').classList.add('hidden'); $('camera-screen').classList.add('hidden'); $('preview-screen').classList.add('hidden'); $('done-screen').classList.remove('hidden');
  $('done-name').textContent = `${cname}さん、着きましたね`;
  $('done-time').textContent = ctime;
  try {
    const s = await calcStreak();
    $('streak-value').textContent = s.streak + '週';
    $('streak-week').textContent = `今週 ${s.wd}/${s.wt} 達成中`;
  } catch (e) {}
}

function toDateStr(d) {
  return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
}
function addDays(date, days) {
  const d = new Date(date);
  d.setDate(d.getDate() + days);
  return d;
}
function weekMondayOf(dateStr) {
  const d = new Date(dateStr + 'T00:00:00');
  const day = d.getDay();
  d.setDate(d.getDate() - (day === 0 ? 6 : day - 1));
  d.setHours(0,0,0,0);
  return d;
}
function isSuccessStatus(status) {
  return status === 'in_progress' || status === 'completed';
}
function isPlannedStatus(status) {
  return ['scheduled','in_progress','completed','missed','rescheduled'].includes(status);
}
function calcWeeklyStreak(goals, logs) {
  const successByWeek = {};
  const plannedByWeek = {};
  (logs || []).forEach(log => {
    const week = toDateStr(weekMondayOf(log.date));
    plannedByWeek[week] = plannedByWeek[week] || 0;
    successByWeek[week] = successByWeek[week] || 0;
    if (isPlannedStatus(log.status)) plannedByWeek[week]++;
    if (isSuccessStatus(log.status)) successByWeek[week]++;
  });
  const goalMap = {};
  (goals || []).forEach(goal => {
    goalMap[goal.week_start_date] = Number(goal.target_count || 0);
  });
  let streak = 0;
  let cursor = weekMondayOf(toDateStr(new Date()));
  for (let i = 0; i < 52; i++) {
    const week = toDateStr(cursor);
    const target = goalMap[week] || plannedByWeek[week] || 0;
    const done = successByWeek[week] || 0;
    if (target <= 0) break;
    if (done >= target) streak++;
    else break;
    cursor = addDays(cursor, -7);
  }
  return streak;
}
async function calcStreak() {
  const today = new Date(), ts = toDateStr(today);
  const ago = new Date(today); ago.setDate(ago.getDate() - 180);
  const mon = weekMondayOf(ts);
  const ms = toDateStr(mon);
  const sun = toDateStr(addDays(mon, 6));
  const { data: logs } = await sb.from('daily_logs').select('date,status').eq('client_id', cid)
    .gte('date', toDateStr(ago)).lte('date', ts).order('date', { ascending: false });
  const { data: goals } = await sb.from('weekly_goals').select('*').eq('client_id', cid).order('week_start_date', { ascending: false }).limit(100);
  const { data: currentGoals } = await sb.from('weekly_goals').select('*').eq('client_id', cid).eq('week_start_date', ms).limit(1);
  const currentGoal = currentGoals && currentGoals[0];
  const weekLogs = (logs || []).filter(l => l.date >= ms && l.date <= sun && isPlannedStatus(l.status));
  const wd = weekLogs.filter(l => isSuccessStatus(l.status)).length;
  const wt = Math.max(Number(currentGoal?.target_count || 0), weekLogs.length, 1);
  return { streak: calcWeeklyStreak(goals || [], logs || []), wd, wt };
}

function showUnavailable(title, body) {
  $('hero-title').innerHTML = title;
  $('hero-sub').innerHTML = body.replace(/\n/g, '<br>');
  $('start-btn').disabled = true;
  $('start-btn').textContent = 'LINEで「モニター」と送ってください';
  dbg(body, false);
}

function showL(t) { $('load-text').textContent = t; $('loading').classList.add('show'); }
function hideL() { $('loading').classList.remove('show'); }
window.addEventListener('beforeunload', () => { if (stream) stream.getTracks().forEach(t => t.stop()); });
</script>
